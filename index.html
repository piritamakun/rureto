<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイバールーレットシステム - Kaminari Update Deluxe & Rebirth</title>
    <!-- PeerJS P2P通信ライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* サイバーパンク風の全体スタイル & アニメーション背景 */
        :root {
            --primary-cyan: #00ffff;
            --primary-pink: #ff00ff;
            --primary-yellow: #ffd700;
            --primary-green: #00ff66;
            --bg-dark: #030712;
            --panel-bg: rgba(6, 18, 36, 0.85);
            --border-glow: rgba(0, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Courier New', Courier, 'Hiragino Kaku Gothic ProN', 'Meiryo', monospace;
            background-color: var(--bg-dark);
            color: var(--primary-cyan);
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            position: relative;
        }

        /* スキャンラインエフェクト */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 左上メニューボタン */
        #menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 60;
            background: rgba(0, 20, 40, 0.85);
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4), inset 0 0 8px rgba(0, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        #menu-btn:hover {
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 20px var(--primary-cyan), inset 0 0 12px var(--primary-cyan);
            transform: translateY(-2px) scale(1.02);
            text-shadow: 0 0 8px var(--primary-cyan);
        }
        #menu-btn:active {
            transform: translateY(1px) scale(0.96);
        }

        /* 画面左真ん中 インデックスボタン */
        #index-btn {
            position: absolute;
            top: 38%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(0, 40, 20, 0.85);
            color: var(--primary-green);
            border: 1px solid var(--primary-green);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4), inset 0 0 8px rgba(0, 255, 102, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #index-btn:hover {
            background: rgba(0, 255, 102, 0.25);
            box-shadow: 0 0 20px var(--primary-green), inset 0 0 12px var(--primary-green);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-green);
        }
        #index-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 画面左真ん中 トレードボタン（インデックスボタンの下） */
        #trade-btn {
            position: absolute;
            top: 58%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(40, 0, 40, 0.85);
            color: var(--primary-pink);
            border: 1px solid var(--primary-pink);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4), inset 0 0 8px rgba(255, 0, 255, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #trade-btn:hover {
            background: rgba(255, 0, 255, 0.25);
            box-shadow: 0 0 20px var(--primary-pink), inset 0 0 12px var(--primary-pink);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-pink);
        }
        #trade-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 左側下部 リバースボタン */
        #rebirth-btn {
            position: absolute;
            top: 78%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(40, 20, 0, 0.85);
            color: var(--primary-yellow);
            border: 1px solid var(--primary-yellow);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4), inset 0 0 8px rgba(255, 215, 0, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #rebirth-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 20px var(--primary-yellow), inset 0 0 12px var(--primary-yellow);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-yellow);
        }
        #rebirth-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 右上のステータスパネル (非表示) */
        .stats-container {
            display: none;
        }

        /* 左下のお金表示 */
        #money-display-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(6, 36, 18, 0.85);
            border: 1px solid var(--primary-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.15);
            padding: 15px 25px;
            border-radius: 6px;
            font-weight: bold;
            text-align: left;
            backdrop-filter: blur(8px);
            z-index: 50;
            font-size: 1.5em;
            color: var(--primary-green);
            text-shadow: 0 0 10px var(--primary-green);
            display: flex;
            align-items: baseline;
        }

        /* ルーレット本体のコンテナ */
        .roulette-wrapper {
            position: relative;
            width: 450px;
            height: 450px;
            margin: 40px auto 20px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));
        }

        /* ターゲットポインター（上部の矢印） */
        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--primary-pink);
            z-index: 10;
            filter: drop-shadow(0 0 12px var(--primary-pink));
            animation: pointerPulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes pointerPulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.15); }
        }

        /* 回転するホイール */
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--primary-cyan);
            box-shadow: 0 0 25px var(--primary-cyan), inset 0 0 35px var(--primary-cyan);
            background: conic-gradient(
                #0a192f 0deg 45deg,
                #2b00ff 45deg 90deg,   /* ゴット確定 */
                #0a192f 90deg 135deg,
                #ff00ff 135deg 180deg, /* Character Gacha */
                #051024 180deg 220deg,
                #888800 220deg 230deg, /* サンダー確定 (極小枠) */
                #ff1493 230deg 250deg, /* シークレット確定 (追加枠) */
                #051024 250deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            transform: rotate(0deg);
        }

        /* ルーレット盤面の文字 */
        .wheel-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            text-shadow: 1px 1px 3px #000, 0 0 8px #000, 0 0 10px var(--primary-cyan);
            pointer-events: none;
        }
        .wheel-label span {
            display: inline-block;
            margin-top: 45px;
        }
        .kaminari-label {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px !important;
            font-size: 13px;
            line-height: 1.1;
        }
        .kaminari-label img {
            width: 64px;
            height: 64px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 8px var(--primary-pink));
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

        #mutation-display-container img {
            display: none !important;
        }
        .mutation-thunder::after, .mutation-water::after {
            display: none !important;
        }

        /* 中央の装飾 */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--bg-dark);
            border: 2px solid var(--primary-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-cyan), inset 0 0 10px var(--primary-cyan);
            z-index: 5;
        }

        /* システムメッセージ（結果表示） */
        #roulette-result {
            font-size: 1.4em;
            margin-bottom: 20px;
            height: 35px;
            font-weight: bold;
            text-shadow: 0 0 8px currentColor;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        button {
            position: relative;
            background: rgba(0, 255, 255, 0.1);
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 14px 28px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25) inset, 0 0 8px rgba(0, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        button:hover:not(:disabled)::before {
            left: 100%;
        }
        button:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px var(--primary-cyan), inset 0 0 10px var(--primary-cyan);
            text-shadow: 0 0 8px var(--primary-cyan);
            transform: translateY(-2px) scale(1.03);
        }
        button:active:not(:disabled) {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 0 10px var(--primary-cyan);
        }
        button:disabled {
            border-color: #334155;
            color: #475569;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        #spin10-btn {
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }
        #spin10-btn:hover:not(:disabled) {
            background: rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 20px var(--primary-pink);
            text-shadow: 0 0 8px var(--primary-pink);
        }

        #fast-spin-btn {
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
        }
        #fast-spin-btn:hover:not(:disabled) {
            background: rgba(255, 204, 0, 0.3);
            box-shadow: 0 0 20px var(--primary-yellow);
            text-shadow: 0 0 8px var(--primary-yellow);
        }

        /* メニューモーダル */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(4, 13, 26, 0.95);
            border: 2px solid var(--primary-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 30px;
            z-index: 100;
            border-radius: 8px;
            min-width: 600px;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: blur(12px);
            animation: modalFadeIn 0.25s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .modal h2, .modal p {
            margin-top: 0;
            color: #fff;
            text-shadow: 0 0 8px var(--primary-cyan);
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            cursor: pointer;
            font-size: 1.8em;
            color: var(--primary-pink);
            font-weight: bold;
            transition: all 0.2s;
        }
        .close-btn:hover {
            transform: scale(1.2) rotate(90deg);
            text-shadow: 0 0 10px var(--primary-pink);
        }
        
        .prob-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            color: var(--primary-cyan);
        }
        .prob-table th, .prob-table td {
            border: 1px solid var(--primary-cyan);
            padding: 10px;
            text-align: center;
        }

        /* 近未来風 管理者パネル */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px;
            left: 120px;
            width: 420px;
            background: rgba(5, 15, 30, 0.96);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            z-index: 999;
            border-radius: 8px;
            color: #fff;
            text-align: left;
            user-select: none;
            backdrop-filter: blur(10px);
        }
        #admin-header {
            background: linear-gradient(90deg, #00ffcc, #0088ff);
            color: #000;
            padding: 12px;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            cursor: move;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        .admin-tabs {
            display: flex;
            border-bottom: 1px solid #00ffcc;
        }
        .admin-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            font-size: 0.9em;
            font-weight: bold;
            border-right: 1px solid #00ffcc;
            transition: background 0.2s;
        }
        .admin-tab:last-child { border-right: none; }
        .admin-tab.active { background: #00ffcc; color: #000; }
        .admin-tab-content { display: none; padding: 20px; max-height: 450px; overflow-y: auto; }
        .admin-tab-content.active { display: block; }
        .close-admin { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #000; font-size: 1.3em; font-weight: bold; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; font-size: 0.9em; }
        .admin-row input, .admin-row select { background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px; margin-right: 5px; border-radius: 3px; }
        .admin-row button { background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 12px; font-size: 0.85em; margin: 0; box-shadow: none; }
        .admin-row button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }

        /* 右下・左下の特殊状態表示コンテナ */
        .status-display-container {
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            background: rgba(0, 20, 40, 0.8);
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: none;
        }
        
        #luck-display-container { right: 20px; bottom: 20px; }
        #mutation-display-container { left: auto; right: 20px; bottom: 95px; flex-direction: column; align-items: flex-end; gap: 8px; }
        .status-display-container img { width: 48px; height: 48px; margin-right: 10px; object-fit: contain; }
        .status-text { font-size: 1.5em; font-weight: bold; text-shadow: 0 0 10px currentColor, 0 0 5px #000; }

        /* 基地のアイテム表示用 */
        .base-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 15px;
            max-height: 500px;
            overflow-y: auto;
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .base-item-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .base-item-wrapper:hover { transform: scale(1.05); }
        .base-item {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #ffd700);
            animation: pulse 2s infinite;
        }
        .base-item-rarity {
            font-size: 0.75em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--primary-pink)); }
            100% { transform: scale(1); opacity: 0.85; }
        }

        /* 設定画面要素 */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            padding: 10px 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
        }
        .settings-row select, .settings-row input {
            background: #000;
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }

        /* トレード画面用の個別スタイル */
        .trade-box {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
            margin-top: 15px;
        }
        .trade-slot {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary-pink);
            padding: 15px;
            border-radius: 8px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .trade-slot-left {
            border-color: var(--primary-cyan);
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.15);
        }
        
        .trade-slot-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            width: 100%;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 4px;
        }

        .trade-char-select {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            background: rgba(0, 20, 30, 0.5);
            padding: 8px;
            border-radius: 4px;
        }
        .trade-char-item {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 2px;
            transition: all 0.2s;
        }
        .trade-char-item:hover { filter: brightness(1.2); }
        .trade-char-item.selected {
            border-color: var(--primary-green);
            box-shadow: 0 0 10px var(--primary-green);
            background: rgba(0, 255, 102, 0.2);
        }

        /* トレード左側の強調OKボタン */
        .trade-ok-btn {
            margin-top: 12px;
            width: 100%;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            background: rgba(0, 255, 102, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .trade-ok-btn:hover:not(:disabled) {
            background: rgba(0, 255, 102, 0.4);
            box-shadow: 0 0 25px var(--primary-green);
            transform: scale(1.02);
        }
        .trade-ok-btn.active-ok {
            background: var(--primary-green);
            color: #000;
            box-shadow: 0 0 25px var(--primary-green);
            text-shadow: none;
        }

        .pulse-text { animation: pulseText 1.5s infinite alternate; }
        @keyframes pulseText { 0% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 変異(バフ)エフェクトクラス */
        .filter-gold { filter: drop-shadow(0 0 15px gold) sepia(1) hue-rotate(15deg) saturate(3) brightness(1.2) !important; }
        .filter-diamond { filter: drop-shadow(0 0 15px cyan) hue-rotate(180deg) saturate(2) brightness(1.5) !important; }
        .filter-rainbow { animation: rainbowFilter 2s linear infinite !important; }
        @keyframes rainbowFilter {
            0% { filter: drop-shadow(0 0 15px red) hue-rotate(0deg) saturate(3); }
            50% { filter: drop-shadow(0 0 15px lime) hue-rotate(180deg) saturate(3); }
            100% { filter: drop-shadow(0 0 15px blue) hue-rotate(360deg) saturate(3); }
        }
        .filter-thunder { filter: drop-shadow(0 0 20px #e6e600) hue-rotate(40deg) saturate(2) brightness(1.3) !important; }
        .filter-water { filter: drop-shadow(0 0 20px #00bfff) hue-rotate(180deg) saturate(2) brightness(1.2) !important; }

        /* ============================================================
           ★ 新トレード画面 (TRADE UI v2) 追加スタイル
           ※ 既存の .trade-* スタイルはそのまま残してあります
           ============================================================ */
        .tr2 {
            width: min(1100px, calc(88vw - 70px));
            max-height: 84vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 2px 6px 6px;
            text-align: center;
        }
        .tr2::-webkit-scrollbar,
        .tr2-pick::-webkit-scrollbar,
        .tr2-offer::-webkit-scrollbar { width: 10px; }
        .tr2::-webkit-scrollbar-thumb,
        .tr2-pick::-webkit-scrollbar-thumb,
        .tr2-offer::-webkit-scrollbar-thumb { background: rgba(0,255,255,0.35); border-radius: 5px; }

        .tr2-title { margin: 0 0 6px; color: var(--primary-pink); font-size: 1.5em; letter-spacing: 2px; }

        /* 上部ステータスバー */
        .tr2-bar {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
            background: rgba(0,255,255,0.06); border: 1px solid rgba(0,255,255,0.3);
            border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 0.85em;
        }
        .tr2-chip {
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            padding: 4px 12px; border: 1px solid currentColor; border-radius: 20px; background: rgba(0,0,0,0.45);
        }
        .tr2-mini {
            padding: 5px 12px !important; font-size: 0.8em !important; margin: 0 !important; border-radius: 20px !important;
        }

        /* 手順ガイド */
        .tr2-steps { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; flex-wrap: wrap; }
        .tr2-step {
            flex: 1 1 170px; padding: 8px 10px; border-radius: 8px; font-size: 0.78em; line-height: 1.4;
            border: 1px solid #244a5c; background: rgba(0,25,45,0.5); color: #6f95a8; transition: all 0.25s;
        }
        .tr2-step b { display: block; font-size: 1.1em; margin-bottom: 2px; }
        .tr2-step.on {
            border-color: var(--primary-green); color: #fff;
            background: rgba(0,255,102,0.15); box-shadow: 0 0 14px rgba(0,255,102,0.35);
        }
        .tr2-step.done { border-color: rgba(0,255,102,0.45); color: var(--primary-green); background: rgba(0,255,102,0.07); }

        /* お知らせ行 */
        .tr2-notice {
            min-height: 20px; font-size: 0.88em; font-weight: bold; margin-bottom: 8px; line-height: 1.4;
        }

        /* 交換ボード */
        .tr2-board { display: flex; align-items: stretch; gap: 12px; }
        .tr2-panel {
            flex: 1 1 0; min-width: 0; background: rgba(0,0,0,0.55);
            border: 2px solid var(--primary-pink); border-radius: 12px; padding: 12px;
            display: flex; flex-direction: column;
        }
        .tr2-panel.mine { border-color: var(--primary-cyan); box-shadow: inset 0 0 18px rgba(0,255,255,0.12); }
        .tr2-panel h4 { margin: 0 0 4px; font-size: 1.05em; letter-spacing: 1px; }
        .tr2-panel .tr2-sub { font-size: 0.75em; color: #90a4b0; margin: 0 0 8px; }
        .tr2-offer {
            flex: 1; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: flex-start;
            min-height: 210px; max-height: 320px; overflow-y: auto;
            background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px;
        }
        .tr2-empty { color: #6f7f8a; font-size: 0.88em; margin: auto; padding: 16px 6px; line-height: 1.7; }

        /* キャラクターカード（大きい画像＋名前＋レア度） */
        .tr2-card {
            width: 134px; background: rgba(0,0,0,0.55); border: 1px solid #333; border-radius: 10px;
            padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .tr2-card img { width: 106px; height: 106px; object-fit: contain; }
        .tr2-name { font-size: 0.82em; font-weight: bold; line-height: 1.2; word-break: break-word; }
        .tr2-rar { font-size: 0.72em; opacity: 0.95; }
        .tr2-price { font-size: 0.68em; color: #9fb; opacity: 0.85; }
        .tr2-tags { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; margin-top: 3px; }
        .tr2-tag { font-size: 0.6em; padding: 1px 6px; border: 1px solid currentColor; border-radius: 8px; }

        /* 中央の交換マーク */
        .tr2-swap {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 4px; color: var(--primary-yellow); font-weight: bold; min-width: 62px; font-size: 0.72em;
        }
        .tr2-swap .ico { font-size: 2.3em; text-shadow: 0 0 18px var(--primary-yellow); animation: pulseText 1.2s infinite alternate; }

        /* 選択リスト */
        .tr2-picker {
            margin-top: 12px; border: 1px solid rgba(0,255,255,0.3); border-radius: 12px;
            background: rgba(0,20,35,0.5); padding: 10px;
        }
        .tr2-picker-head {
            display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px;
        }
        .tr2-filters { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        .tr2-filters button {
            margin: 0 !important; padding: 4px 11px !important; font-size: 0.72em !important; border-radius: 20px !important;
        }
        .tr2-filters button.on { background: var(--primary-cyan) !important; color: #000 !important; font-weight: bold; }
        .tr2-pick {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr));
            gap: 8px; max-height: 250px; overflow-y: auto; padding: 4px;
        }
        .tr2-pick-item {
            cursor: pointer; border: 2px solid transparent; border-radius: 10px; padding: 6px 4px;
            background: rgba(0,0,0,0.45); transition: all 0.15s; position: relative;
        }
        .tr2-pick-item img { width: 78px; height: 78px; object-fit: contain; display: block; margin: 0 auto; }
        .tr2-pick-item .tr2-name { font-size: 0.72em; margin-top: 4px; }
        .tr2-pick-item .tr2-rar { font-size: 0.65em; }
        .tr2-pick-item:hover { border-color: rgba(0,255,255,0.6); transform: translateY(-2px); }
        .tr2-pick-item.sel {
            border-color: var(--primary-green); background: rgba(0,255,102,0.18); box-shadow: 0 0 12px var(--primary-green);
        }
        .tr2-pick-item.sel::after {
            content: "\2714"; position: absolute; top: 4px; right: 5px; color: #000; background: var(--primary-green);
            width: 20px; height: 20px; line-height: 20px; border-radius: 50%; font-size: 0.72em; font-weight: bold;
        }
        .tr2-pick-item.locked { opacity: 0.4; cursor: not-allowed; }
        .tr2-pick-item.locked:hover { border-color: transparent; transform: none; }

        /* 決定ボタン行 */
        .tr2-confirm { display: flex; gap: 12px; align-items: stretch; margin-top: 12px; flex-wrap: wrap; }
        .tr2-okbtn {
            flex: 2 1 340px; padding: 16px 20px; font-size: 1.12em; font-weight: bold; border-radius: 10px;
            border: 2px solid var(--primary-green); color: var(--primary-green); background: rgba(0,255,102,0.12);
            cursor: pointer; transition: all 0.2s; letter-spacing: 1px; line-height: 1.4;
        }
        .tr2-okbtn:hover:not(:disabled) { background: rgba(0,255,102,0.3); box-shadow: 0 0 22px var(--primary-green); }
        .tr2-okbtn.on { background: var(--primary-green); color: #000; box-shadow: 0 0 25px var(--primary-green); text-shadow: none; }
        .tr2-okbtn:disabled { border-color: #666; color: #888; background: rgba(255,255,255,0.05); cursor: not-allowed; box-shadow: none; }
        .tr2-peerstat {
            flex: 1 1 210px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 2px dashed #3a4a5a; border-radius: 10px; padding: 10px; font-weight: bold; font-size: 0.95em; color: #8896a2;
        }
        .tr2-peerstat.ok {
            border-style: solid; border-color: var(--primary-green); color: var(--primary-green); background: rgba(0,255,102,0.09);
        }

        /* ロビー */
        .tr2-lobby { display: flex; gap: 16px; flex-wrap: wrap; margin: 14px 0; }
        .tr2-lobby-card { flex: 1 1 290px; border-radius: 12px; padding: 18px; text-align: left; }
        .tr2-roomcode {
            font-size: 3em; font-weight: bold; color: var(--primary-yellow); letter-spacing: 10px;
            text-shadow: 0 0 20px var(--primary-yellow); margin: 10px 0;
        }
        .tr2-help {
            font-size: 0.8em; color: #8fd8bb; background: rgba(0,255,102,0.07);
            border: 1px solid rgba(0,255,102,0.35); border-radius: 8px; padding: 10px 14px; text-align: left; line-height: 1.7;
        }

        /* 成立演出 */
        .tr2-done-title { color: var(--primary-green); font-size: 1.8em; text-shadow: 0 0 20px var(--primary-green); margin: 0 0 4px; }
        @keyframes tr2Pop { 0% { transform: scale(0.6); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
        .tr2-pop { animation: tr2Pop 0.45s cubic-bezier(0.2, 1.3, 0.4, 1) both; }

        /* 狭い画面対応 */
        @media (max-width: 760px) {
            .modal { min-width: 0; width: 94vw; max-width: 94vw; padding: 18px 12px; }
            .tr2 { width: 100%; max-height: 80vh; }
            .tr2-board { flex-direction: column; }
            .tr2-swap { flex-direction: row; min-width: 0; min-height: 42px; gap: 10px; }
            .tr2-swap .ico { font-size: 1.8em; }
            .tr2-card { width: 112px; }
            .tr2-card img { width: 88px; height: 88px; }
            .tr2-pick { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
            .tr2-pick-item img { width: 66px; height: 66px; }
            .tr2-roomcode { font-size: 2.2em; letter-spacing: 6px; }
        }

        /* タブボタン用 */
        .index-tabs button { margin: 0 5px; padding: 10px 15px; font-size: 0.9em; }
        /* コレクションボタン（新規追加） */
        #collection-btn {
            position: absolute;
            top: 38%;
            right: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(25, 0, 45, 0.88);
            color: #b967ff;
            border: 1px solid #b967ff;
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(185, 103, 255, 0.45), inset 0 0 8px rgba(185, 103, 255, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #collection-btn:hover {
            background: rgba(185, 103, 255, 0.25);
            box-shadow: 0 0 20px #b967ff, inset 0 0 12px #b967ff;
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px #b967ff;
        }
        #collection-btn:active { transform: translateY(-50%) scale(0.96); }

        /* BOLT変異ビジュアル（新規追加） */
        .filter-bolt {
            filter: drop-shadow(0 0 22px #8cf7ff) hue-rotate(155deg) saturate(2.5) brightness(1.35) !important;
            animation: boltPulse 0.65s steps(2, end) infinite;
        }
        @keyframes boltPulse {
            0%, 100% { opacity: 1; transform: translateY(0) scale(1); }
            50% { opacity: 0.84; transform: translateY(-2px) scale(1.035); }
        }

    </style>

    <!-- BGMオーディオ -->
    <audio id="bgm-audio" src="bgm.mp3" autoplay loop preload="auto"></audio>

        function formatMoney(value) {
            if (value >= 1e15) return (value / 1e15).toFixed(1).replace(/\.0$/, '') + 'Qa';
            if (value >= 1e12) return (value / 1e12).toFixed(1).replace(/\.0$/, '') + 'T';
            if (value >= 1e9) return (value / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
            if (value >= 1e6) return (value / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
            if (value >= 1e3) return (value / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
            return value.toString();

        // --- P2P Network (PeerJS) 初期化 & 通信対応 ---
        function setupPeer(customPeerId = null) {
            if (peer) {
                try { peer.destroy(); } catch(e){}
            }
            
            const peerOptions = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            };

            const targetId = customPeerId || myUserId;
            peer = new Peer(targetId, peerOptions);

            peer.on('open', (id) => {
                console.log('Peer connected successfully with ID:', id);
                // P2P接続が開いたことを明示的に記録。接続待ちの誤判定を防止
                peerReady = true;
            });
            peer.on('close', () => {
                peerReady = false;
            });

            peer.on('connection', (conn) => {
                if (activeConn && activeConn !== conn && activeConn.open) {
                    try {
                        conn.send({ type: 'ROOM_FULL' });
                        conn.close();
                    } catch(e){}
                    return;
                }
                activeConn = conn;
                setupConnectionListeners(conn);
                renderTradeUI();
            });

            peer.on('disconnected', () => {
                if (peer && !peer.destroyed) {
                    peer.reconnect();
                }
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'unavailable-id' && isHost) {
                    createTradeRoom();
                } else if (err.type === 'peer-unavailable') {
                    resetTradeState();
                    renderTradeUI();
                }
            });
        }

        /* ★修正版：通信ハンドラ
           ・交換確定(tradeFinalized)後に届く CANCEL / close で状態が消えないようガード
           ・TRADE_EXEC / TRADE_DONE を追加し、片側だけ交換される事故を防止
           ・相手が中身を変更したら自分のOKも自動解除（詐欺防止・分かりやすさ向上） */
        function setupConnectionListeners(conn) {
            const onOpen = () => {
                modal.style.display = 'block';
                tradeFinalized = false;
                tradeSetNotice('相手と接続しました！出すキャラクターを選んでください。', 'var(--primary-green)');
                renderTradeUI();
                // 接続前に選んでいた分を必ず送る
                try { conn.send({ type: 'SELECT_CHARS', chars: myTradeOffer() }); } catch(e){}
            };
            // ★重要：すでに open 済みの接続では 'open' は二度と発火しない。
            //   参加者側は conn.on('open') の中でこの関数を呼ぶため、
            //   以前は初期選択が相手に送られないことがあった。
            if (conn.open) { setTimeout(onOpen, 0); } else { conn.on('open', onOpen); }

            conn.on('data', (data) => {
                if (!data) return;

                if (data.type === 'ROOM_FULL') {
                    tradeSetNotice('その部屋はすでに満員です（1対1専用）。', '#ff8888');
                    resetTradeState();
                    setupPeer();
                    renderTradeUI();

                } else if (data.type === 'SELECT_CHAR') {
                    // 旧バージョンとの互換用
                    if (tradeFinalized) return;
                    peerSelectedTradeChars = sanitizeTradeList([data.charStr]);
                    onPeerOfferChanged();

                } else if (data.type === 'SELECT_CHARS') {
                    if (tradeFinalized) return;
                    peerSelectedTradeChars = sanitizeTradeList(data.chars);
                    onPeerOfferChanged();

                } else if (data.type === 'TOGGLE_OK') {
                    if (tradeFinalized) return;

                    // ★安全確認：OK時は「相手が出す物」「相手が把握している自分の物」を必ず照合
                    if (data.ok && Array.isArray(data.mine)) {
                        const theirOffer = sanitizeTradeList(data.mine);
                        const myOffer = myTradeOffer();
                        const mismatch =
                            tradeSig(theirOffer) !== tradeSig(peerSelectedTradeChars) ||
                            (Array.isArray(data.theirs) && tradeSig(data.theirs) !== tradeSig(myOffer));
                        if (mismatch) {
                            peerSelectedTradeChars = theirOffer;
                            peerTradeOk = false;
                            myTradeOk = false;
                            try { activeConn.send({ type: 'SELECT_CHARS', chars: myOffer }); } catch(e){}
                            try { activeConn.send({ type: 'TOGGLE_OK', ok: false }); } catch(e){}
                            tradeSetNotice('表示のズレを検出したため、いったんOKを解除しました。内容を確認してもう一度OKしてください。', 'var(--primary-yellow)');
                            renderTradeUI();
                            return;
                        }
                        peerSelectedTradeChars = theirOffer;
                    }

                    peerTradeOk = !!data.ok;
                    tradeSetNotice(
                        peerTradeOk ? '相手がOKしました！あなたもOKすれば交換成立です。' : '相手がOKを解除しました。',
                        peerTradeOk ? 'var(--primary-green)' : 'var(--primary-yellow)'
                    );
                    renderTradeUI();
                    checkAndExecuteTrade();

                } else if (data.type === 'TRADE_EXEC' || data.type === 'TRADE_DONE') {
                    // 相手側で交換が確定した合図。自分がOK済みなら必ず自分も交換する
                    if (tradeFinalized) return;
                    if (!myTradeOk) return;
                    peerTradeOk = true;
                    checkAndExecuteTrade();

                    if (tradeFinalized) return; // ★成立後のCANCELは無視（これが「交換したのに変わらない」原因だった）
                    tradeSetNotice('相手がトレードを中止しました。', '#ff8888');
                    resetTradeState();
                    setupPeer();
                    renderTradeUI();
                }
            });

                if (activeConn !== conn) return;
                if (tradeFinalized) { activeConn = null; return; } // ★成立後の切断では在庫を触らない
                tradeSetNotice('相手との接続が切れました。', '#ff8888');
                resetTradeState();
                setupPeer();
                renderTradeUI();
            });

            conn.on('error', (err) => {
                console.error("Connection error:", err);
                if (activeConn !== conn) return;
                if (tradeFinalized) { activeConn = null; return; }

        // --- Web Audio API 高品質サウンドジェネレーター ---
        class CyberAudioSynthesizer {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playClick() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            }
            playSpin() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playJackpot() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51, 1760];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + idx * 0.06;
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(startTime); osc.stop(startTime + 0.4);
                });
            }
        }

        // キャラクター抽選ロジック
        function rollCharacter(guaranteedRarity = null) {
            let pool = characters;
            if (guaranteedRarity) {
                pool = characters.filter(c => c.rarity === guaranteedRarity);
                if(pool.length > 0) return pool[Math.floor(Math.random() * pool.length)];
            }
            
            const rand = Math.random() * 100;
            if (rand < 0.5) {
                const thunders = characters.filter(c => c.rarity === 'サンダー');
                return thunders[Math.floor(Math.random() * thunders.length)];
            }
            if (rand < 2.0) {
                const secrets = characters.filter(c => c.rarity === 'シークレット');
                return secrets[Math.floor(Math.random() * secrets.length)];
            }
            if (rand < 6.0) {
                const gods = characters.filter(c => c.rarity === 'ゴット');
                return gods[Math.floor(Math.random() * gods.length)];
            }
            if (rand < 21.0) {
                const legends = characters.filter(c => c.rarity === 'レジェンド');
                return legends[Math.floor(Math.random() * legends.length)];
            }
            if (rand < 51.0) {
                const rares = characters.filter(c => c.rarity === 'レア');
                return rares[Math.floor(Math.random() * rares.length)];
            }
            const uncommons = characters.filter(c => c.rarity === 'アンコモン');
            return uncommons[Math.floor(Math.random() * uncommons.length)];
        }

            isHost = false;

            const guestPeerId = 'trade-guest-' + Math.floor(100000 + Math.random() * 900000).toString();
            if (peer) { try { peer.destroy(); } catch(e){} }

            const peerOptions = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            };
            peer = new Peer(guestPeerId, peerOptions);

            peer.on('open', () => {
                const targetHostId = 'trade-room-' + currentRoomCode;
                const conn = peer.connect(targetHostId, { reliable: true, serialization: 'json' });
                let connected = false;
                // PeerJSは接続直後にopenになる場合と少し遅れてopenになる場合があるため、
                // ここでは connection オブジェクト自体を先に登録してイベントを取りこぼさない。
                activeConn = conn;
                const timeout = setTimeout(() => {
                    if (!connected && (!activeConn || !activeConn.open)) {
                        try { conn.close(); } catch(e){}
                        activeConn = null;
                        tradeSetNotice('部屋が見つかりませんでした。番号を確認して、相手が部屋を開いているか確かめてください。', '#ff8888');
                        resetTradeState();
                        setupPeer();
                        renderTradeUI();
                    }
                }, 10000);

                conn.on('open', () => {
                    connected = true;
                    clearTimeout(timeout);
                    activeConn = conn;
                    setupConnectionListeners(conn);
                    // openイベントが既に発火済みのケースも含め、接続状態を即時表示
                    renderTradeUI();
                });
                conn.on('close', () => {
                    if (tradeFinalized) return;
                    if (activeConn === conn) activeConn = null;
                });
                conn.on('error', (err) => {
                    clearTimeout(timeout);
                    tradeSetNotice('接続に失敗しました。もう一度お試しください。', '#ff8888');
                    resetTradeState();
                    setupPeer();
                    renderTradeUI();
                });
            });

            peer.on('error', (err) => {
                console.error("Guest Peer Error:", err);
                if (activeConn) return;
                tradeSetNotice('接続エラーが発生しました。番号を確認してもう一度お試しください。', '#ff8888');
                resetTradeState();
                renderTradeUI();
            });
            renderTradeUI();
        }

        // 部屋番号をコピー
        function copyRoomCode() {
            if (!currentRoomCode) return;
            audioSynth.playClick();
            const txt = currentRoomCode;
            const done = () => { tradeSetNotice('部屋番号 ' + txt + ' をコピーしました！', 'var(--primary-green)'); renderTradeUI(); };
            const fallback = () => {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
                    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
                    document.body.removeChild(ta); done();
                } catch(e) {
                    tradeSetNotice('コピーできませんでした。番号を手で伝えてください。', '#ff8888');
                    renderTradeUI();
                }
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(done).catch(fallback);
            } else { fallback(); }
        }

        /* ---------- 表示用ヘルパー ---------- */

        // キャラ文字列 "id:変異:バフ" を表示情報に変換
        function tradeCharInfo(itemStr) {
            const parts = String(itemStr || '').split(':');
            const mut = parts[1] || 'normal';
            const buff = parts[2] || 'none';
            const info = characters.find(c => c.id === parts[0]) || characters[0];
            let fx = "";
            if (mut === 'gold') fx += " filter-gold";
            if (mut === 'diamond') fx += " filter-diamond";
            if (mut === 'rainbow') fx += " filter-rainbow";
            if (buff === 'thunder') fx += " filter-thunder";
            if (buff === 'water') fx += " filter-water";
            let tags = "";
            if (mut === 'gold') tags += '<span class="tr2-tag" style="color:gold;">GOLD</span>';
            if (mut === 'diamond') tags += '<span class="tr2-tag" style="color:cyan;">DIAMOND</span>';
            if (mut === 'rainbow') tags += '<span class="tr2-tag" style="color:#ff00ff;">RAINBOW</span>';
            if (buff === 'thunder') tags += '<span class="tr2-tag" style="color:#e6e600;">⚡雷バフ</span>';
            if (buff === 'water') tags += '<span class="tr2-tag" style="color:#00bfff;">💧水バフ</span>';
            return { info: info, mut: mut, buff: buff, fx: fx.trim(), tags: tags };
        }

        // 参考価値（売値と同じ計算）※交換の目安表示に使用
        function tradeValueOf(itemStr) {
            const parts = String(itemStr || '').split(':');
            const info = characters.find(c => c.id === parts[0]);
            const mut = parts[1] || 'normal';
            let p = 100;
            if (info) {
                if (info.rarity === 'ゴット') p = 2000;
                if (info.rarity === 'レジェンド') p = 800;
                if (info.rarity === 'シークレット') p = 3000;
                if (info.rarity === 'サンダー') p = 5000;
            }
            if (mut === 'gold') p *= 3;
            if (mut === 'diamond') p *= 10;
            if (mut === 'rainbow') p *= 50;
            return p;
        }

        // 大きいキャラカード（画像＋名前＋レア度＋タグ）
        function buildTradeCard(itemStr) {
            const d = tradeCharInfo(itemStr);
            return `
                <div class="tr2-card tr2-pop" style="border-color:${d.info.color || '#333'};">
                    <img src="${d.info.img}" class="${d.fx}" alt="${d.info.name}">
                    <div class="tr2-name" style="color:${d.info.color || '#fff'};">${d.info.name}</div>
                    <div class="tr2-rar" style="color:${d.info.color || '#aaa'};">${d.info.rarity}</div>
                    <div class="tr2-price">参考 $${formatMoney(tradeValueOf(itemStr))}</div>
                    <div class="tr2-tags">${d.tags}</div>
                </div>`;
        }

        function buildTradeNoticeHtml() {
            if (!tradeNotice) return '<div class="tr2-notice">&nbsp;</div>';
            return `<div class="tr2-notice" style="color:${tradeNoticeColor};">${tradeNotice}</div>`;
        }

        /* ---------- 画面描画 ---------- */
        function renderTradeUI() {
            modal.style.display = 'block';

            // 再描画してもスクロール位置・入力値を失わないよう退避
            const prevPick = document.getElementById('tr2-pick');
            if (prevPick) tradePickScroll = prevPick.scrollTop;
            const prevInput = document.getElementById('join-room-id');
            const prevInputVal = prevInput ? prevInput.value : '';

            if (tradeLastResult) {
                modalBody.innerHTML = buildTradeResultHtml();
            } else if (!activeConn) {
                modalBody.innerHTML = buildTradeLobbyHtml();
            } else {
                modalBody.innerHTML = buildTradeRoomHtml();
            }

            const pick = document.getElementById('tr2-pick');
            if (pick) pick.scrollTop = tradePickScroll;
            const input = document.getElementById('join-room-id');
            if (input) {
                if (prevInputVal) input.value = prevInputVal;
                input.onkeydown = function(e) { if (e.key === 'Enter') joinTradeRoom(); };
                input.oninput = function() { this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4); };
            }
        }

        // --- ロビー（未接続時） ---
        function buildTradeLobbyHtml() {
            if (isHost && currentRoomCode) {
                return `
                <div class="tr2">
                    <h2 class="tr2-title">P2P 1対1 トレード</h2>

                        <div class="tr2-roomcode">${currentRoomCode}</div>
                        <button onclick="copyRoomCode()" class="tr2-mini" style="border-color:var(--primary-yellow); color:var(--primary-yellow);">📋 番号をコピー</button>
                        <p class="pulse-text" style="font-size:0.9em; color:var(--primary-cyan); margin:16px 0 0;">相手が この番号を入力すると自動でつながります…</p>

                    <div class="tr2-help">
                        ① あなた：この4桁の番号を相手に伝える<br>

                </div>`;
            }

            if (!isHost && currentRoomCode) {
                return `
                <div class="tr2">
                    <h2 class="tr2-title">P2P 1対1 トレード</h2>
                    ${buildTradeNoticeHtml()}
                    <div style="margin:22px 0; padding:22px; border:2px solid var(--primary-pink); border-radius:12px; background:rgba(255,0,255,0.06);">
                        <p style="font-size:1.1em; color:var(--primary-cyan); margin:0;">部屋番号 [ <strong style="color:var(--primary-yellow);">${currentRoomCode}</strong> ] に接続中…</p>
                        <p class="pulse-text" style="font-size:0.9em; color:#aaa; margin:10px 0 0;">ホストの応答を待っています（最大10秒）</p>

                </div>`;
            }

            return `
            <div class="tr2">
                <h2 class="tr2-title">P2P 1対1 キャラクタートレード</h2>
                ${buildTradeNoticeHtml()}
                <div class="tr2-help" style="margin-bottom:6px;">
                    <b style="color:#fff;">かんたん3ステップ</b><br>
                    ① どちらかが部屋を作る　→　② もう一人が4桁番号で入る　→　③ お互いキャラを選んでOK！
                </div>
                <div class="tr2-lobby">
                    <div class="tr2-lobby-card" style="background:rgba(0,255,255,0.06); border:2px solid var(--primary-cyan);">
                        <h3 style="margin:0 0 8px; color:var(--primary-cyan); font-size:1.1em;">① トレード部屋を作る</h3>
                        <p style="font-size:0.8em; color:#aaa; margin:0 0 14px; line-height:1.6;">ボタンを押すと4桁の部屋番号が出ます。その番号を相手に伝えてください。</p>
                        <button onclick="createTradeRoom()" style="border-color:var(--primary-cyan); color:var(--primary-cyan); font-weight:bold; width:100%; padding:14px; margin:0;">トレード部屋を作成</button>
                    </div>
                    <div class="tr2-lobby-card" style="background:rgba(255,0,255,0.06); border:2px solid var(--primary-pink);">
                        <h3 style="margin:0 0 8px; color:var(--primary-pink); font-size:1.1em;">② 相手の部屋に入る</h3>
                        <p style="font-size:0.8em; color:#aaa; margin:0 0 14px; line-height:1.6;">教えてもらった4桁の番号を入力して参加します（Enterでも参加）。</p>
                        <div style="display:flex; gap:10px; justify-content:center; align-items:center;">
                            <input type="text" id="join-room-id" inputmode="numeric" placeholder="0000" maxlength="4" style="background:#000; color:#fff; border:2px solid var(--primary-pink); padding:11px; font-size:1.4em; width:130px; text-align:center; border-radius:6px; letter-spacing:6px;">
                            <button onclick="joinTradeRoom()" style="border-color:var(--primary-pink); color:var(--primary-pink); font-weight:bold; padding:12px 18px; margin:0;">部屋に参加</button>
                        </div>
                    </div>
                </div>
                <div style="font-size:0.78em; color:#7f95a2; line-height:1.7; text-align:left; border-top:1px solid rgba(0,255,255,0.2); padding-top:10px;">
                    ・トレードは1対1です。交換はお互いがOKを押した瞬間に成立します。<br>
                    ・変異（GOLD / DIAMOND / RAINBOW）やバフが付いたキャラは、その状態のまま相手に渡ります。<br>
                    ・基地の空き枠が足りないときは交換できません。先に整理するかリバースで枠を広げてください。
                </div>
                <br>
                <button onclick="closeModal()" style="font-size:0.85em; padding:10px 20px;">閉じる</button>
            </div>`;
        }

        // --- 接続中のトレード画面 ---
        function buildTradeRoomHtml() {
            const maxCap = getMaxBaseCapacity();
            const giveCount = mySelectedTradeIndices.filter(i => baseItems[i] !== undefined).length;
            const after = baseItems.length - giveCount + peerSelectedTradeChars.length;
            const over = after > maxCap;

            // 自分が出すキャラ
            let mineHtml = "";
            let myValue = 0;
            if (giveCount === 0) {
                mineHtml = `<div class="tr2-empty">下のリストから<br><b style="color:var(--primary-cyan);">出したいキャラをタップ</b>して選んでください<br><span style="font-size:0.9em;">（何も出さずにOKすることもできます）</span></div>`;
            } else {
                mySelectedTradeIndices.forEach(i => {
                    if (baseItems[i] === undefined) return;
                    mineHtml += buildTradeCard(baseItems[i]);
                    myValue += tradeValueOf(baseItems[i]);
                });
            }

            // 相手が出すキャラ
            let peerHtml = "";
            let peerValue = 0;
            if (peerSelectedTradeChars.length === 0) {
                peerHtml = `<div class="tr2-empty">相手はまだ選んでいません…<br><span style="font-size:0.9em;">相手が選ぶとここに大きく表示されます</span></div>`;
            } else {
                peerSelectedTradeChars.forEach(cs => {
                    peerHtml += buildTradeCard(cs);
                    peerValue += tradeValueOf(cs);
                });
            }

            // 交換バランスの目安
            let judge = 'まだ内容が決まっていません', jColor = '#8896a2';
            if (giveCount > 0 || peerSelectedTradeChars.length > 0) {
                if (peerValue >= myValue * 1.2) { judge = '🟢 あなたが得しそうな交換です'; jColor = 'var(--primary-green)'; }
                else if (myValue >= peerValue * 1.2) { judge = '🔴 あなたが損しそうな交換です'; jColor = '#ff6b6b'; }
                else { judge = '🟡 ほぼ互角の交換です'; jColor = 'var(--primary-yellow)'; }
            }

            // 手順ガイド
            const s1 = myTradeOk ? 'done' : 'on';
            const s2 = myTradeOk ? 'done' : (giveCount > 0 || peerSelectedTradeChars.length > 0 ? 'on' : '');
            const s3 = myTradeOk ? 'on' : '';

            // レア度フィルタ
            const rarityList = ['すべて', 'アンコモン', 'レア', 'レジェンド', 'ゴット', 'シークレット', 'サンダー'];
            let filterHtml = "";
            rarityList.forEach(r => {
                const key = (r === 'すべて') ? 'all' : r;
                const on = (tradeFilter === key) ? 'on' : '';
                filterHtml += `<button class="${on}" onclick="setTradeFilter('${key}')">${r}</button>`;
            });

            // 選択リスト
            let pickHtml = "";
            let shown = 0;
            baseItems.forEach((itemStr, index) => {
                const d = tradeCharInfo(itemStr);
                if (tradeFilter !== 'all' && d.info.rarity !== tradeFilter) return;
                shown++;
                const sel = mySelectedTradeIndices.includes(index) ? 'sel' : '';
                const lock = myTradeOk ? 'locked' : '';
                pickHtml += `
                    <div class="tr2-pick-item ${sel} ${lock}" onclick="selectTradeChar(${index})" title="${d.info.name}（${d.info.rarity}）">
                        <img src="${d.info.img}" class="${d.fx}" alt="${d.info.name}">
                        <div class="tr2-name" style="color:${d.info.color || '#fff'};">${d.info.name}</div>
                        <div class="tr2-rar" style="color:${d.info.color || '#aaa'};">${d.info.rarity}</div>
                        <div class="tr2-tags">${d.tags}</div>
                    </div>`;
            });
            if (shown === 0) {
                pickHtml = `<div style="grid-column:1/-1; color:#777; font-size:0.85em; padding:24px;">${baseItems.length === 0 ? '基地にキャラクターがいません' : 'この絞り込みに合うキャラクターがいません'}</div>`;
            }

            // OKボタン
            let okLabel, okClass = "", okDisabled = "";
            if (over) {
                okLabel = '⚠ 基地の枠が足りません（' + after + ' / ' + maxCap + '）';
                okDisabled = 'disabled';
            } else if (myTradeOk) {
                okLabel = '✔ OK済み！相手を待っています<br><span style="font-size:0.75em; font-weight:normal;">押すと解除して選び直せます</span>';
                okClass = 'on';
            } else {
                okLabel = '✅ この内容でOK！<br><span style="font-size:0.75em; font-weight:normal;">お互いOKで即交換されます</span>';
            }

            return `
            <div class="tr2">
                <h2 class="tr2-title">トレード中</h2>
                <div class="tr2-bar">
                    <span class="tr2-chip" style="color:var(--primary-green);">🟢 接続中（1対1）</span>
                    <span class="tr2-chip" style="color:var(--primary-yellow);">部屋番号 ${currentRoomCode || '----'}</span>
                    <span class="tr2-chip" style="color:${over ? '#ff6b6b' : 'var(--primary-cyan)'};">基地 ${baseItems.length} → <b>${after}</b> / ${maxCap}</span>
                    <span class="tr2-chip" style="color:${jColor};">${judge}</span>
                </div>

                <div class="tr2-steps">
                    <div class="tr2-step ${s1}"><b>① キャラを選ぶ</b>下のリストからタップ</div>
                    <div class="tr2-step ${s2}"><b>② OKを押す</b>内容を確認して決定</div>
                    <div class="tr2-step ${s3}"><b>③ 相手もOKで成立</b>自動で交換されます</div>
                </div>

                ${buildTradeNoticeHtml()}

                <div class="tr2-board">
                    <div class="tr2-panel mine">
                        <h4 style="color:var(--primary-cyan);">👤 あなたが出す（${giveCount}体）</h4>
                        <p class="tr2-sub">合計の参考価値：$${formatMoney(myValue)}</p>
                        <div class="tr2-offer">${mineHtml}</div>
                    </div>
                    <div class="tr2-swap">
                        <div class="ico">⇄</div>
                        <div>こうかん</div>
                    </div>
                    <div class="tr2-panel">
                        <h4 style="color:var(--primary-pink);">🧑 相手が出す（${peerSelectedTradeChars.length}体）</h4>
                        <p class="tr2-sub">合計の参考価値：$${formatMoney(peerValue)}</p>
                        <div class="tr2-offer">${peerHtml}</div>
                    </div>
                </div>

                <div class="tr2-picker">
                    <div class="tr2-picker-head">
                        <div style="font-size:0.85em; color:var(--primary-cyan); font-weight:bold;">
                            📦 あなたの基地から選ぶ（選択中 ${giveCount} / ${baseItems.length}体）
                        </div>
                        <div style="display:flex; gap:6px;">
                            <button class="tr2-mini" onclick="clearTradeSelection()" ${myTradeOk ? 'disabled' : ''} style="border-color:#ff8888; color:#ff8888;">選択をすべて解除</button>
                        </div>
                    </div>
                    <div class="tr2-filters">${filterHtml}</div>
                    <div class="tr2-pick" id="tr2-pick">${pickHtml}</div>
                    ${myTradeOk ? '<div style="font-size:0.78em; color:var(--primary-yellow); margin-top:8px;">🔒 OK中は変更できません。変更したい場合は下のOKボタンをもう一度押して解除してください。</div>' : ''}
                </div>

                <div class="tr2-confirm">
                    <button class="tr2-okbtn ${okClass}" onclick="toggleMyOk()" ${okDisabled}>${okLabel}</button>
                    <div class="tr2-peerstat ${peerTradeOk ? 'ok' : ''}">
                        ${peerTradeOk ? '✔ 相手：OK済み' : '⏳ 相手：選択中…'}
                        <span style="font-size:0.75em; font-weight:normal; margin-top:4px;">
                            ${peerTradeOk ? 'あなたがOKすれば成立！' : '相手の準備を待っています'}
                        </span>
                    </div>
                </div>

                ${over ? '<div style="margin-top:10px; color:#ff6b6b; font-size:0.85em; font-weight:bold;">⚠ 交換後の基地が上限を超えます。出すキャラを増やすか、基地を整理／リバースで枠を広げてください。</div>' : ''}

                <br>
                <button onclick="cancelTrade()" style="border-color:#ff4444; color:#ff4444; font-size:0.85em; padding:10px 18px;">トレード中止（部屋を出る）</button>
            </div>`;
        }

        // --- 成立画面 ---
        function buildTradeResultHtml() {
            const gave = (tradeLastResult && tradeLastResult.gave) || [];
            const got = (tradeLastResult && tradeLastResult.got) || [];

            let gaveHtml = gave.length ? gave.map(buildTradeCard).join('') : '<div class="tr2-empty">なし</div>';
            let gotHtml = got.length ? got.map(buildTradeCard).join('') : '<div class="tr2-empty">なし</div>';

            return `
            <div class="tr2">
                <h2 class="tr2-done-title">🎉 トレード成立！</h2>
                <p style="font-size:0.9em; color:var(--primary-cyan); margin-top:0;">キャラクターは基地に反映されました（保存済み）</p>
                <div class="tr2-board">
                    <div class="tr2-panel mine" style="border-color:#ff8888;">
                        <h4 style="color:#ff8888;">📤 渡したキャラ（${gave.length}体）</h4>
                        <div class="tr2-offer">${gaveHtml}</div>
                    </div>
                    <div class="tr2-swap"><div class="ico">➡</div><div>こうかん</div></div>
                    <div class="tr2-panel" style="border-color:var(--primary-green);">
                        <h4 style="color:var(--primary-green);">📥 受け取ったキャラ（${got.length}体）</h4>
                        <div class="tr2-offer">${gotHtml}</div>
                    </div>
                </div>
                <p style="font-size:0.95em; color:#fff; margin-top:14px;">現在の基地：<b style="color:var(--primary-yellow);">${baseItems.length} / ${getMaxBaseCapacity()}</b></p>
                <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px;">
                    <button onclick="tradeAgain()" style="border-color:var(--primary-cyan); color:var(--primary-cyan); padding:12px 20px;">もう一度トレードする</button>
                    <button onclick="showBaseMenu()" style="border-color:var(--primary-pink); color:var(--primary-pink); padding:12px 20px;">基地を確認する</button>
                    <button onclick="closeTradeResult()" style="padding:12px 20px;">閉じる</button>
                </div>
            </div>`;
        }

        function tradeAgain() {
            audioSynth.playClick();
            tradeLastResult = null;
            resetTradeState();
            setupPeer();
            tradeNotice = "";
            renderTradeUI();
        }

        function closeTradeResult() {
            audioSynth.playClick();
            tradeLastResult = null;
            tradeFinalized = false;
            modal.style.display = 'none';
        }

        function setTradeFilter(r) {
            audioSynth.playClick();
            tradeFilter = r;
            tradePickScroll = 0;
            renderTradeUI();
        }

        /* ---------- 操作 ---------- */
        function selectTradeChar(index) {
            if (tradeFinalized) return;
            if (myTradeOk) {
                tradeSetNotice('🔒 OK中は内容を変更できません。OKボタンをもう一度押して解除してください。', 'var(--primary-yellow)');
                renderTradeUI();
                return;
            }
            audioSynth.playClick();
            if (index < 0 || index >= baseItems.length) return;
            const pos = mySelectedTradeIndices.indexOf(index);
            if (pos > -1) mySelectedTradeIndices.splice(pos, 1);
            else mySelectedTradeIndices.push(index);
            mySelectedTradeIndices.sort((a, b) => a - b);
            if (activeConn) {
                try { activeConn.send({ type: 'SELECT_CHARS', chars: mySelectedTradeIndices.map(i => baseItems[i]).filter(v => v !== undefined) }); } catch(e){}
            }
            renderTradeUI();
        }

        function clearTradeSelection() {
            if (tradeFinalized || myTradeOk) return;
            audioSynth.playClick();
            mySelectedTradeIndices = [];
            if (activeConn) { try { activeConn.send({ type: 'SELECT_CHARS', chars: [] }); } catch(e){} }
            renderTradeUI();
        }

        function toggleMyOk() {
            if (tradeFinalized) return;
            const maxCap = getMaxBaseCapacity();
            const giveCount = mySelectedTradeIndices.filter(i => baseItems[i] !== undefined).length;
            const after = baseItems.length - giveCount + peerSelectedTradeChars.length;
            if (!myTradeOk && after > maxCap) {
                tradeSetNotice('基地の枠が足りません（交換後 ' + after + ' / ' + maxCap + '）。出すキャラを増やすか基地を整理してください。', '#ff6b6b');
                renderTradeUI();
                return;
            }
            audioSynth.playClick();
            myTradeOk = !myTradeOk;
            if (activeConn) {
                try {
                    activeConn.send({
                        type: 'TOGGLE_OK', ok: myTradeOk,
                        mine: myTradeOffer(),                  // 自分が出す物
                        theirs: peerSelectedTradeChars.slice()  // 自分に見えている相手の物
                    });
                } catch(e){}
            }
            tradeSetNotice(myTradeOk ? 'OKしました。相手のOKを待っています…' : 'OKを解除しました。選び直せます。',
                           myTradeOk ? 'var(--primary-green)' : 'var(--primary-yellow)');
            renderTradeUI();
            checkAndExecuteTrade();
        }

        /* ---------- ★交換の実行（バグ修正の中心） ---------- */
        function checkAndExecuteTrade() {
            if (tradeFinalized) return;
            if (!(myTradeOk && peerTradeOk && activeConn)) return;

            const maxCap = getMaxBaseCapacity();
            const giveIdx = mySelectedTradeIndices.filter(i => baseItems[i] !== undefined);
            const getList = peerSelectedTradeChars.slice();
            const after = baseItems.length - giveIdx.length + getList.length;

            if (after > maxCap) {
                myTradeOk = false;
                peerTradeOk = false;
                try { activeConn.send({ type: 'TOGGLE_OK', ok: false }); } catch(e){}
                tradeSetNotice('基地の枠が足りないため交換できませんでした（' + after + ' / ' + maxCap + '）。', '#ff6b6b');
                renderTradeUI();
                return;
            }

            // ★ここで確定。以降、相手からのCANCEL・切断では在庫を巻き戻さない
            tradeFinalized = true;
            try { activeConn.send({ type: 'TRADE_EXEC' }); } catch(e){}
            applyTradeSwap(giveIdx, getList);
        }

        // スナップショットを使って即座に交換を反映（タイマー待ちをやめたのが修正点）
        function applyTradeSwap(giveIdx, getList) {
            const gave = giveIdx.map(i => baseItems[i]).filter(v => typeof v === 'string');
            if (gave.length !== giveIdx.length) {
                myTradeOk = false;
                peerTradeOk = false;
                tradeFinalized = false;
                tradeSetNotice('基地の内容が変わったため、安全のためOKを解除しました。もう一度確認してください。', '#ff6b6b');
                renderTradeUI();
                return;
            }

            // 出すキャラを削除（インデックスがずれないよう降順で）
            giveIdx.slice().sort((a, b) => b - a).forEach(idx => {
                if (idx >= 0 && idx < baseItems.length) baseItems.splice(idx, 1);
            });

            // 受け取るキャラを追加（変異・バフもそのまま／図鑑も解放）
            const got = [];
            getList.forEach(charStr => {
                if (typeof charStr !== 'string' || !charStr) return;
                baseItems.push(charStr);
                const p = charStr.split(':');
                unlockedCharacters[p[0] + ":" + (p[1] || 'normal')] = true;
                got.push(charStr);
            });

            saveState();
            updateUI();
            try { audioSynth.playJackpot(); } catch(e){}

            tradeLastResult = { gave: gave, got: got };
            tradeNotice = "";
            if (tradeNoticeTimer) clearTimeout(tradeNoticeTimer);

            // 相手に完了を伝えてから静かに切断（このとき CANCEL は送らない）
            if (activeConn) { try { activeConn.send({ type: 'TRADE_DONE' }); } catch(e){} }
            setTimeout(() => {
                if (activeConn) { try { activeConn.close(); } catch(e){} activeConn = null; }
                mySelectedTradeIndices = [];
                peerSelectedTradeChars = [];
                myTradeOk = false;
                peerTradeOk = false;
                currentRoomCode = null;
                isHost = false;
                setupPeer();
            }, 900);

            renderTradeUI();
        }

        function cancelTrade() {
            audioSynth.playClick();
            if (activeConn && !tradeFinalized) {
                try { activeConn.send({ type: 'CANCEL' }); } catch(e){}
            }
            resetTradeState();
            setupPeer();
            renderTradeUI();
        }

        // --- リバース機能 (最大10段階) ---

                `;

            }

            modalBody.innerHTML = `
