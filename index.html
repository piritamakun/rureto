                </div>

                <div class="tr2-confirm">
                    <button class="tr2-okbtn ${okClass}" onclick="toggleMyOk()" ${okDisabled}>${okLabel}</button>
                    <div class="tr2-peerstat ${peerTradeOk ? 'ok' : ''}">
                        ${peerTradeOk ? '✔ 相手：OK済み' : '⏳ 相手：選択中…'}
                        <span style="font-size:0.75em; font-weight:normal; margin-top:4px;">
                            ${peerTradeOk ? 'あなたがOKすれば成立！' : '相手の準備を待っています'}
                        </span>
                    </div>
                </div>

                ${over ? '<div style="margin-top:10px; color:#ff6b6b; font-size:0.85em; font-weight:bold;">⚠ 交換後の基地が上限を超えます。出すキャラを増やすか、基地を整理／リバースで枠を広げてください。</div>' : ''}

                <br>
                <button onclick="cancelTrade()" style="border-color:#ff4444; color:#ff4444; font-size:0.85em; padding:10px 18px;">トレード中止（部屋を出る）</button>
            </div>`;
        }

        // --- 成立画面 ---
        function buildTradeResultHtml() {
            const gave = (tradeLastResult && tradeLastResult.gave) || [];
            const got = (tradeLastResult && tradeLastResult.got) || [];

            let gaveHtml = gave.length ? gave.map(buildTradeCard).join('') : '<div class="tr2-empty">なし</div>';
            let gotHtml = got.length ? got.map(buildTradeCard).join('') : '<div class="tr2-empty">なし</div>';

            return `
            <div class="tr2">
                <h2 class="tr2-done-title">🎉 トレード成立！</h2>
                <p style="font-size:0.9em; color:var(--primary-cyan); margin-top:0;">キャラクターは基地に反映されました（保存済み）</p>
                <div class="tr2-board">
                    <div class="tr2-panel mine" style="border-color:#ff8888;">
                        <h4 style="color:#ff8888;">📤 渡したキャラ（${gave.length}体）</h4>
                        <div class="tr2-offer">${gaveHtml}</div>
                    </div>
                    <div class="tr2-swap"><div class="ico">➡</div><div>こうかん</div></div>
                    <div class="tr2-panel" style="border-color:var(--primary-green);">
                        <h4 style="color:var(--primary-green);">📥 受け取ったキャラ（${got.length}体）</h4>
                        <div class="tr2-offer">${gotHtml}</div>
                    </div>
                </div>
                <p style="font-size:0.95em; color:#fff; margin-top:14px;">現在の基地：<b style="color:var(--primary-yellow);">${baseItems.length} / ${getMaxBaseCapacity()}</b></p>
                <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:6px;">
                    <button onclick="tradeAgain()" style="border-color:var(--primary-cyan); color:var(--primary-cyan); padding:12px 20px;">もう一度トレードする</button>
                    <button onclick="showBaseMenu()" style="border-color:var(--primary-pink); color:var(--primary-pink); padding:12px 20px;">基地を確認する</button>
                    <button onclick="closeTradeResult()" style="padding:12px 20px;">閉じる</button>
                </div>
            </div>`;
        }

        function tradeAgain() {
            audioSynth.playClick();
            tradeLastResult = null;
            resetTradeState();
            setupPeer();
            tradeNotice = "";
            renderTradeUI();
        }

        function closeTradeResult() {
            audioSynth.playClick();
            tradeLastResult = null;
            tradeFinalized = false;
            modal.style.display = 'none';
        }

        function setTradeFilter(r) {
            audioSynth.playClick();
            tradeFilter = r;
            tradePickScroll = 0;
            renderTradeUI();
        }

        /* ---------- 操作 ---------- */
        function selectTradeChar(index) {
            if (tradeFinalized) return;
            if (myTradeOk) {
                tradeSetNotice('🔒 OK中は内容を変更できません。OKボタンをもう一度押して解除してください。', 'var(--primary-yellow)');
                renderTradeUI();
                return;
            }
            audioSynth.playClick();
            if (index < 0 || index >= baseItems.length) return;
            const pos = mySelectedTradeIndices.indexOf(index);
            if (pos > -1) mySelectedTradeIndices.splice(pos, 1);
            else mySelectedTradeIndices.push(index);
            mySelectedTradeIndices.sort((a, b) => a - b);
            if (activeConn) {
                try { activeConn.send({ type: 'SELECT_CHARS', chars: mySelectedTradeIndices.map(i => baseItems[i]).filter(v => v !== undefined) }); } catch(e){}
            }
            renderTradeUI();
        }

        function clearTradeSelection() {
            if (tradeFinalized || myTradeOk) return;
            audioSynth.playClick();
            mySelectedTradeIndices = [];
            if (activeConn) { try { activeConn.send({ type: 'SELECT_CHARS', chars: [] }); } catch(e){} }
            renderTradeUI();
        }

        function toggleMyOk() {
            if (tradeFinalized) return;
            const maxCap = getMaxBaseCapacity();
            const giveCount = mySelectedTradeIndices.filter(i => baseItems[i] !== undefined).length;
            const after = baseItems.length - giveCount + peerSelectedTradeChars.length;
            if (!myTradeOk && after > maxCap) {
                tradeSetNotice('基地の枠が足りません（交換後 ' + after + ' / ' + maxCap + '）。出すキャラを増やすか基地を整理してください。', '#ff6b6b');
                renderTradeUI();
                return;
            }
            audioSynth.playClick();
            myTradeOk = !myTradeOk;
            if (activeConn) {
                try {
                    activeConn.send({
                        type: 'TOGGLE_OK', ok: myTradeOk,
                        mine: myTradeOffer(),                  // 自分が出す物
                        theirs: peerSelectedTradeChars.slice()  // 自分に見えている相手の物
                    });
                } catch(e){}
            }
            tradeSetNotice(myTradeOk ? 'OKしました。相手のOKを待っています…' : 'OKを解除しました。選び直せます。',
                           myTradeOk ? 'var(--primary-green)' : 'var(--primary-yellow)');
            renderTradeUI();
            checkAndExecuteTrade();
        }

        /* ---------- ★交換の実行（バグ修正の中心） ---------- */
        function checkAndExecuteTrade() {
            if (tradeFinalized) return;
            if (!(myTradeOk && peerTradeOk && activeConn)) return;

            const maxCap = getMaxBaseCapacity();
            const giveIdx = mySelectedTradeIndices.filter(i => baseItems[i] !== undefined);
            const getList = peerSelectedTradeChars.slice();
            const after = baseItems.length - giveIdx.length + getList.length;

            if (after > maxCap) {
                myTradeOk = false;
                peerTradeOk = false;
                try { activeConn.send({ type: 'TOGGLE_OK', ok: false }); } catch(e){}
                tradeSetNotice('基地の枠が足りないため交換できませんでした（' + after + ' / ' + maxCap + '）。', '#ff6b6b');
                renderTradeUI();
                return;
            }

            // ★ここで確定。以降、相手からのCANCEL・切断では在庫を巻き戻さない
            tradeFinalized = true;
            try { activeConn.send({ type: 'TRADE_EXEC' }); } catch(e){}
            applyTradeSwap(giveIdx, getList);
        }

        // スナップショットを使って即座に交換を反映（タイマー待ちをやめたのが修正点）
        function applyTradeSwap(giveIdx, getList) {
            const gave = giveIdx.map(i => baseItems[i]).filter(v => typeof v === 'string');

            // 出すキャラを削除（インデックスがずれないよう降順で）
            giveIdx.slice().sort((a, b) => b - a).forEach(idx => {
                if (idx >= 0 && idx < baseItems.length) baseItems.splice(idx, 1);
            });

            // 受け取るキャラを追加（変異・バフもそのまま／図鑑も解放）
            const got = [];
            getList.forEach(charStr => {
                if (typeof charStr !== 'string' || !charStr) return;
                baseItems.push(charStr);
                const p = charStr.split(':');
                unlockedCharacters[p[0] + ":" + (p[1] || 'normal')] = true;
                got.push(charStr);
            });

            saveState();
            updateUI();
            try { audioSynth.playJackpot(); } catch(e){}

            tradeLastResult = { gave: gave, got: got };
            tradeNotice = "";
            if (tradeNoticeTimer) clearTimeout(tradeNoticeTimer);

            // 相手に完了を伝えてから静かに切断（このとき CANCEL は送らない）
            if (activeConn) { try { activeConn.send({ type: 'TRADE_DONE' }); } catch(e){} }
            setTimeout(() => {
                if (activeConn) { try { activeConn.close(); } catch(e){} activeConn = null; }
                mySelectedTradeIndices = [];
                peerSelectedTradeChars = [];
                myTradeOk = false;
                peerTradeOk = false;
                currentRoomCode = null;
                isHost = false;
                setupPeer();
            }, 900);

            renderTradeUI();
        }

        function cancelTrade() {
            audioSynth.playClick();
            if (activeConn && !tradeFinalized) {
                try { activeConn.send({ type: 'CANCEL' }); } catch(e){}
            }
            resetTradeState();
            setupPeer();
            renderTradeUI();
        }

        // --- リバース機能 (最大10段階) ---
        function openRebirthMenu() {
            audioSynth.playClick();
            modal.style.display = 'block';
            
            if (rebirthCount >= 10) {
                modalBody.innerHTML = `
                    <h2 style="color:var(--primary-yellow);">REBIRTH (リバース)</h2>
                    <p style="color:#fff; font-size:1.2em;">あなたは既に限界 (10回) までリバースしています。<br>これ以上のリバースはできません。</p>
                    <button onclick="closeModal()" style="margin-top:20px; padding:10px 20px;">閉じる</button>
                `;
                return;
            }
            
            let cost = rebirthCosts[rebirthCount];
            let canRebirth = money >= cost;
            
            modalBody.innerHTML = `
                <h2 style="color:var(--primary-yellow);">REBIRTH (リバース)</h2>
                <p style="color:#aaa; font-size:0.95em; line-height:1.5;">リバースを実行すると、必要なお金（$${formatMoney(cost)}）のみ消費され、<strong style="color:#0f0;">キャラクターは保持されたまま</strong><br>基地に配置したキャラクターの<strong style="color:#0f0;">「毎秒のお金稼ぎ効率」と「基地の最大所持枠」が永続的に大幅アップ</strong>します！</p>
                
                <div style="margin:20px 0; padding:20px; border:2px solid ${canRebirth ? 'var(--primary-yellow)' : '#555'}; background:rgba(0,0,0,0.5); border-radius:8px;">
                    <h3 style="margin-top:0; color:var(--primary-yellow);">次のリバース: 第 ${rebirthCount + 1} 段階</h3>
                    <p style="font-size:1.4em; color:${canRebirth ? '#0f0' : '#f00'}; font-weight:bold;">必要な費用: $${formatMoney(cost)}</p>
                    <p style="color:#fff; font-size:1.1em;">現在のお金: $${formatMoney(money)}</p>
                    <p style="color:var(--primary-cyan); font-size:0.95em;">リバース後の基地容量: <strong style="color:#0f0;">${10 + (rebirthCount + 1) * 2}枠</strong> (現在: ${getMaxBaseCapacity()}枠)</p>
                </div>
                
                <button onclick="executeRebirth()" ${!canRebirth ? 'disabled' : ''} style="font-size:1.2em; padding:12px 30px; border-color:var(--primary-yellow); color:var(--primary-yellow); margin-right:10px;">
                    リバースを実行する
                </button>
                <button onclick="closeModal()" style="font-size:1em; padding:12px 20px;">キャンセル</button>
            `;
        }

        function executeRebirth() {
            let cost = rebirthCosts[rebirthCount];
            if (money >= cost && rebirthCount < 10) {
                audioSynth.playJackpot();
                money -= cost;
                rebirthCount++;
                saveState();
                updateUI();
                openRebirthMenu();
            }
        }

        // --- 自動お金稼ぎループ ---
        setInterval(() => {
            let income = 0;
            if (baseItems.length > 0) {
                baseItems.forEach(itemStr => {
                    let parts = itemStr.split(':');
                    let charId = parts[0];
                    let charInfo = characters.find(c => c.id === charId) || characters[0];
                    
                    let baseIncome = 1;
                    if (charInfo.rarity === 'レア') baseIncome = 2;
                    else if (charInfo.rarity === 'レジェンド') baseIncome = 5;
                    else if (charInfo.rarity === 'ゴット') baseIncome = 10;
                    else if (charInfo.rarity === 'シークレット') baseIncome = 50;
                    else if (charInfo.rarity === 'サンダー') baseIncome = 100;
                    
                    let mutType = parts[1] || 'normal';
                    if (mutType === 'gold') baseIncome *= 2;
                    if (mutType === 'diamond') baseIncome *= 5;
                    if (mutType === 'rainbow') baseIncome *= 20;
                    
                    income += baseIncome;
                });
                
                // リバースボーナス (1回につき +50%)
                income = Math.floor(income * (1 + (rebirthCount * 0.5)));
                money += income;
            }
            
            document.getElementById('money-val').innerText = formatMoney(money);
            
            const incomeEl = document.getElementById('income-val');
            if (incomeEl) {
                if (income > 0) {
                    incomeEl.innerText = `(+${formatMoney(income)}/s)`;
                } else {
                    incomeEl.innerText = "";
                }
            }
        }, 1000);

        updateUI();
        updateStatusEffects();
        setInterval(updateStatusEffects, 1000);
        setupPeer();

        const modal = document.getElementById('main-modal');
        const modalBody = document.getElementById('modal-body');

        let secretBuffer = "";
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'select') return;

            if (e.key.toLowerCase() === 'm') {
                if (modal.style.display === 'block') closeModal();
                else openMenu();
            }

            if (isAdminUnlocked && e.key.toLowerCase() === 'k') {
                const adminPanel = document.getElementById('admin-panel');
                adminPanel.style.display = adminPanel.style.display === 'block' ? 'none' : 'block';
            }

            secretBuffer += e.key;
            if (secretBuffer.length > 10) secretBuffer = secretBuffer.slice(-10);
            if (secretBuffer.includes("140923")) {
                isAdminUnlocked = true;
                document.getElementById('admin-panel').style.display = 'block';
                secretBuffer = ""; 
            }
        });

        function closeModal() {
            audioSynth.playClick();
            if (activeConn || currentRoomCode) {
                cancelTrade();
            }
            tradeLastResult = null; // ★トレード成立画面を閉じたら結果を掃除
            modal.style.display = 'none';
        }

        // インデックス画面 (サンダーをシークレットの上に修正)
        function showIndexMenu(viewType = 'normal') {
            audioSynth.playClick();
            modal.style.display = 'block';
            
            let tabsHtml = `
                <div class="index-tabs" style="display:flex; justify-content:center; margin-bottom:15px; flex-wrap:wrap; gap:5px;">
                    <button onclick="showIndexMenu('normal')" style="${viewType==='normal' ? 'background:var(--primary-cyan); color:#000;' : ''}">ノーマル</button>
                    <button onclick="showIndexMenu('gold')" style="border-color:gold; color:gold; ${viewType==='gold' ? 'background:gold; color:#000;' : ''}">ゴールド</button>
                    <button onclick="showIndexMenu('diamond')" style="border-color:cyan; color:cyan; ${viewType==='diamond' ? 'background:cyan; color:#000;' : ''}">ダイヤモンド</button>
                    <button onclick="showIndexMenu('rainbow')" style="border-color:#ff00ff; color:#ff00ff; ${viewType==='rainbow' ? 'background:linear-gradient(90deg, red, lime, blue); color:#fff; border:none;' : ''}">レインボー</button>
                </div>
            `;

            let gridHtml = '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:20px; max-height:450px; overflow-y:auto; padding:10px;">';

            const rarityWeights = { 'アンコモン': 1, 'レア': 2, 'レジェンド': 3, 'ゴット': 4, 'シークレット': 5, 'サンダー': 6 };
            let sortedCharacters = [...characters].sort((a, b) => (rarityWeights[a.rarity] || 99) - (rarityWeights[b.rarity] || 99));

            sortedCharacters.forEach(c => {
                const storeId = c.id + ":" + viewType;
                const isUnlocked = unlockedCharacters[storeId] || (viewType === 'normal' && unlockedCharacters[c.id]);

                let extraClass = "";
                if(viewType === 'gold') extraClass = "filter-gold";
                if(viewType === 'diamond') extraClass = "filter-diamond";
                if(viewType === 'rainbow') extraClass = "filter-rainbow";

                let imgStyle = isUnlocked ? `width:120px; height:120px; filter:drop-shadow(0 0 10px ${c.color});` : "width:120px; height:120px; filter:brightness(0) opacity(0.3);";
                let statusText = isUnlocked ? "<span style='color:#0f0; font-size:1em; font-weight:bold;'>[ 取得済 ]</span>" : "<span style='color:#f00; font-size:1em;'>[ 未取得 ]</span>";
                let titleText = isUnlocked ? c.name : "???";

                gridHtml += `
                    <div style="background:rgba(0,0,0,0.6); padding: 15px; border: 1px solid ${isUnlocked ? c.color : '#333'}; border-radius:8px; text-align:center;">
                        <img src="${c.img}" alt="${c.id}" class="${isUnlocked ? extraClass : ''}" style="${imgStyle} transition:all 0.5s; object-fit:contain;">
                        <div style="color:${isUnlocked ? c.color : '#666'}; margin: 10px 0 5px; font-size:1.1em; font-weight:bold; word-wrap:break-word;">${titleText}</div>
                        <div style="color:#ddd; font-size:0.9em; margin-bottom:10px; border-bottom:1px solid #444; padding-bottom:5px;">${c.rarity}</div>
                        ${statusText}
                    </div>
                `;
            });
            gridHtml += '</div>';

            modalBody.innerHTML = `
                <h2 style="color:#00ff66; text-transform:uppercase; letter-spacing:2px; margin-bottom: 20px;">CHARACTER INDEX</h2>
                ${tabsHtml}
                ${gridHtml}
                <br>
                <button onclick="closeModal()" style="font-size:0.9em; padding:10px 20px; border-color:#00ff66; color:#00ff66;">閉じる</button>
            `;
        }

        function getBaseBuffProbability() {
            const now = Date.now();
            const isAnyBuffActive = (activeMutations.thunder !== 0 && (activeMutations.thunder > now || activeMutations.thunder === -1)) || 
                                    (activeMutations.water !== 0 && (activeMutations.water > now || activeMutations.water === -1));
            return isAnyBuffActive ? mutationProb * 2.5 : mutationProb;
        }

        function showProbability() {
            audioSynth.playClick();
            modal.style.display = 'block';
            let currentBuffProb = getBaseBuffProbability();
            
            const now = Date.now();
            const isAnyBuffActive = (activeMutations.thunder !== 0 && (activeMutations.thunder > now || activeMutations.thunder === -1)) || 
                                    (activeMutations.water !== 0 && (activeMutations.water > now || activeMutations.water === -1));
            
            let buffHtml = "";
            if (isAnyBuffActive) {
                buffHtml = `
                    <div style="background: rgba(0, 255, 255, 0.1); padding: 10px; border: 1px solid var(--primary-cyan); margin-top: 10px;">
                        <strong style="color: #00ffcc;">[基地バフ付与 成功確率]</strong><br>
                        現在の設定値: ${currentBuffProb}% <span style="font-size:0.8em;">(全体バフ発動中は確率アップ！)</span>
                    </div>
                `;
            }

            modalBody.innerHTML = `
                <h2>${t('probTitle')}</h2>
                <div style="display:flex; justify-content:center; align-items: stretch; text-align:left; flex-direction:column;">
                    <table class="prob-table" style="margin-top:0;">
                        <tr><th>${t('itemHeader')}</th><th>${t('probHeader')}</th></tr>
                        <tr><td style="color:#ff1493;">シークレット確定</td><td>1.0 %</td></tr>
                        <tr><td style="color:#e6e600;">サンダー確定</td><td>0.005 %</td></tr>
                        <tr><td style="color:#a8a8a8;">アンコモン確定</td><td>38.995 %</td></tr>
                        <tr><td style="color:#ff00ff;">Character Gacha</td><td>40.0 %</td></tr>
                        <tr><td style="color:#ff00ff;">レジェンド確定</td><td>15.0 %</td></tr>
                        <tr><td style="color:#ff4500;">ゴット確定</td><td>5.0 %</td></tr>
                    </table>
                    <p style="font-size:0.8em; color:#fff;">※ガチャ内訳: 通常サンダーは超低確率(0.5%)</p>
                    ${buffHtml}
                </div>
            `;
        }

        function openMenu() {
            audioSynth.playClick();
            modal.style.display = 'block';
            modalBody.innerHTML = `
                <h2>${t('menuTitle')}</h2>
                <button onclick="showBaseMenu()" style="width:80%; margin-top:12px; border-color:#ff00ff; color:#ff00ff;">${t('baseBtn')}</button><br>
                <button onclick="showSettingsMenu()" style="width:80%; margin-top:12px; border-color:#ffd700; color:#ffd700;">${t('settingsBtn')}</button>
            `;
        }

        // --- 基地管理画面 (レア度表示対応) ---
        function showBaseMenu() {
            audioSynth.playClick();
            let itemsHtml = "";

            for(let i = 0; i < baseItems.length; i++) {
                let itemStr = baseItems[i];
                let parts = itemStr.split(':');
                let charId = parts[0];
                let mutType = parts[1] || 'normal';
                let buffType = parts[2] || 'none';
                
                let charInfo = characters.find(c => c.id === charId) || characters[0];
                
                let extraClass = "";
                if(mutType === 'gold') extraClass += " filter-gold";
                if(mutType === 'diamond') extraClass += " filter-diamond";
                if(mutType === 'rainbow') extraClass += " filter-rainbow";
                if(buffType === 'thunder') extraClass += " filter-thunder";
                if(buffType === 'water') extraClass += " filter-water";

                itemsHtml += `
                    <div class="base-item-wrapper" onclick="manageBaseCharacter(${i})">
                        <img src="${charInfo.img}" class="base-item ${extraClass}" alt="${charInfo.name}" title="${charInfo.name}">
                        <div style="font-size:0.85em; font-weight:bold; color:${charInfo.color || '#fff'}; margin-top:4px;">${charInfo.name}</div>
                        <div class="base-item-rarity" style="color:${charInfo.color || 'var(--primary-cyan)'};">${charInfo.rarity}</div>
                    </div>
                `;
            }

            modalBody.innerHTML = `
                <h2 style="color:#ff00ff;">${t('baseTitle')} ( ${baseItems.length} / ${getMaxBaseCapacity()} )</h2>
                <div class="base-grid">
                    ${itemsHtml || `<span style="color:#777; font-size:0.9em; align-self:center;">${t('emptyBase')}</span>`}
                </div>
                
                <div style="margin-top: 15px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
                    ${baseItems.length > 0 ? `<button onclick="clearAllCharacters()" style="border-color:#ff4444; color:#ff4444; font-size:0.85em; padding:10px 15px;">${t('clearAllBtn')}</button>` : ''}
                    <button onclick="openMenu()" style="font-size:0.85em; padding:10px 15px;">${t('backBtn')}</button>
                </div>
            `;
        }

        function manageBaseCharacter(index) {
            audioSynth.playClick();
            let itemStr = baseItems[index];
            let parts = itemStr.split(':');
            let charId = parts[0];
            let mutType = parts[1] || 'normal';
            let buffType = parts[2] || 'none';

            let charInfo = characters.find(c => c.id === charId) || characters[0];
            let sellPrice = 100;
            if (charInfo.rarity === 'ゴット') sellPrice = 2000;
            if (charInfo.rarity === 'レジェンド') sellPrice = 800;
            if (charInfo.rarity === 'シークレット') sellPrice = 3000;
            if (charInfo.rarity === 'サンダー') sellPrice = 5000;
            
            if (mutType === 'gold') sellPrice *= 3;
            if (mutType === 'diamond') sellPrice *= 10;
            if (mutType === 'rainbow') sellPrice *= 50;

            let buffText = "<span style='color:#777;'>[ バフなし ]</span>";
            if(buffType === 'thunder') buffText = "<span style='color:#e6e600; font-weight:bold;'>[ 雷バフ 発動中 ]</span>";
            if(buffType === 'water') buffText = "<span style='color:#00bfff; font-weight:bold;'>[ ウォーターバフ 発動中 ]</span>";

            let mutText = "";
            if (mutType === 'gold') mutText = "<span style='color:gold;'>【GOLD】</span>";
            if (mutType === 'diamond') mutText = "<span style='color:cyan;'>【DIAMOND】</span>";
            if (mutType === 'rainbow') mutText = "<span style='color:#ff00ff;'>【RAINBOW】</span>";

            let extraClass = "";
            if(mutType === 'gold') extraClass += " filter-gold";
            if(mutType === 'diamond') extraClass += " filter-diamond";
            if(mutType === 'rainbow') extraClass += " filter-rainbow";
            if(buffType === 'thunder') extraClass += " filter-thunder";
            if(buffType === 'water') extraClass += " filter-water";

            modalBody.innerHTML = `
                <h2 style="color:${charInfo.color || '#fff'};">${charInfo.name} ${mutText}</h2>
                <div style="font-size: 1.1em; font-weight:bold; color:${charInfo.color || '#fff'}; margin-bottom:5px;">
                    レア度: ${charInfo.rarity}
                </div>
                <div style="margin: 15px 0;">
                    <img src="${charInfo.img}" class="base-item ${extraClass}" style="width:140px; height:140px;">
                </div>
                <div style="font-size: 1.1em; margin-bottom: 20px;">
                    ステータス: ${buffText}
                </div>
                
                <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
                    <button onclick="sellCharacter(${index}, ${sellPrice})" style="border-color:#ff4444; color:#ff4444;">売る ($${formatMoney(sellPrice)})</button>
                    <button onclick="applyBuffToCharacter(${index})" style="border-color:#00ffcc; color:#00ffcc;" ${buffType !== 'none' ? 'disabled' : ''}>バフ付与を試みる</button>
                </div>
                
                <div style="margin-top: 25px;">
                    <button onclick="showBaseMenu()" style="font-size:0.85em; padding:10px 15px;">基地へ戻る</button>
                </div>
            `;
        }

        function sellCharacter(index, price) {
            audioSynth.playClick();
            if (confirm(`このキャラクターを売却し、$${formatMoney(price)} を獲得しますか？`)) {
                baseItems.splice(index, 1);
                money += price;
                saveState();
                updateUI();
                showBaseMenu();
            }
        }

        function applyBuffToCharacter(index) {
            audioSynth.playClick();
            let itemStr = baseItems[index];
            let parts = itemStr.split(':');
            let charId = parts[0];
            let mutType = parts[1] || 'normal';
            let buffType = parts[2] || 'none';

            if (buffType !== 'none') {
                return;
            }

            let currentProb = getBaseBuffProbability();
            let rand = Math.random() * 100;

            if (rand < currentProb) {
                let newBuff = Math.random() < 0.5 ? 'thunder' : 'water';
                baseItems[index] = `${charId}:${mutType}:${newBuff}`;
                saveState();
                manageBaseCharacter(index); 
            }
        }

        function clearAllCharacters() {
            audioSynth.playClick();
            if (baseItems.length > 0) {
                if (confirm(t('confirmClearAll'))) {
                    let totalMoney = 0;
                    for (let i = 0; i < baseItems.length; i++) {
                        let parts = baseItems[i].split(':');
                        let charInfo = characters.find(c => c.id === parts[0]) || characters[0];
                        let mutType = parts[1] || 'normal';
                        
                        let sellPrice = 100;
                        if (charInfo.rarity === 'ゴット') sellPrice = 2000;
                        if (charInfo.rarity === 'レジェンド') sellPrice = 800;
                        if (charInfo.rarity === 'シークレット') sellPrice = 3000;
                        if (charInfo.rarity === 'サンダー') sellPrice = 5000;
                        if (mutType === 'gold') sellPrice *= 3;
                        if (mutType === 'diamond') sellPrice *= 10;
                        if (mutType === 'rainbow') sellPrice *= 50;
                        
                        totalMoney += sellPrice;
                    }
                    money += totalMoney;
                    baseItems = [];
                    saveState();
                    updateUI();
                    showBaseMenu();
                }
            }
        }

        function showSettingsMenu() {
            audioSynth.playClick();
            modalBody.innerHTML = `
                <h2 style="color:#ffd700;">${t('settingsTitle')}</h2>
                
                <div class="settings-row">
                    <span>自分のID (6桁の数字)</span>
                    <input type="text" id="setting-user-id" value="${myUserId}" maxlength="6" style="width:160px; text-align:center;" onchange="updateMyUserId(this.value)">
                </div>

                <div class="settings-row">
                    <span>${t('langLabel')}</span>
                    <select id="setting-lang" onchange="changeLanguage(this.value)">
                        <option value="ja" ${currentLang === 'ja' ? 'selected' : ''}>日本語 (Japanese)</option>
                        <option value="en" ${currentLang === 'en' ? 'selected' : ''}>English</option>
                    </select>
                </div>

                <div class="settings-row">
                    <span>${t('soundLabel')}</span>
                    <select id="setting-sound" onchange="changeSoundSetting(this.value)">
                        <option value="true" ${isSoundEnabled ? 'selected' : ''}>${t('soundOn')}</option>
                        <option value="false" ${!isSoundEnabled ? 'selected' : ''}>${t('soundOff')}</option>
                    </select>
                </div>

                <div class="settings-row">
                    <span>${t('bgmLabel')}</span>
                    <select id="setting-bgm" onchange="changeBgmSetting(this.value)">
                        <option value="true" ${isBgmEnabled ? 'selected' : ''}>${t('soundOn')}</option>
                        <option value="false" ${!isBgmEnabled ? 'selected' : ''}>${t('soundOff')}</option>
                    </select>
                </div>

                <br>
                <button onclick="openMenu()" style="font-size:0.85em; padding:10px 20px;">${t('backBtn')}</button>
            `;
        }

        function updateMyUserId(val) {
            const cleanVal = val.trim();
            if (/^\d{6}$/.test(cleanVal)) {
                if (cleanVal !== myUserId) {
                    myUserId = cleanVal;
                    saveState();
                    setupPeer();
                }
            } else {
                document.getElementById('setting-user-id').value = myUserId;
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            saveState();
            updateUI();
            showSettingsMenu();
        }

        function changeSoundSetting(val) {
            isSoundEnabled = (val === 'true');
            saveState();
            showSettingsMenu();
        }

        function changeBgmSetting(val) {
            isBgmEnabled = (val === 'true');
            saveState();
            const bgm = document.getElementById('bgm-audio');
            if (isBgmEnabled) bgm.play().catch(()=>{});
            else bgm.pause();
            showSettingsMenu();
        }

        /* --- 管理者パネル用関数 --- */
        function switchAdminTab(tabId, e) {
            audioSynth.playClick();
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.admin-tab-content').forEach(c => c.classList.remove('active'));
            if(e && e.target) e.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        function closeAdmin() {
            audioSynth.playClick();
            document.getElementById('admin-panel').style.display = 'none';
        }

        function addAdminItem(type) {
            audioSynth.playClick();
            if (type === 'money') {
                const val = parseInt(document.getElementById('admin-add-money').value) || 0;
                money += val;
            }
            saveState();
            updateUI();
        }

        function toggleInfinite(checked) {
            audioSynth.playClick();
            isInfiniteSpin = checked;
        }

        function updateLuck() {
            audioSynth.playClick();
            const multi = parseFloat(document.getElementById('admin-luck-multi').value) || 1;
            const sec = parseInt(document.getElementById('admin-luck-time').value) || 60;
            luckMultiplier = multi;
            luckEndTime = Date.now() + (sec * 1000);
            updateStatusEffects();
        }

        function activateMutation() {
            audioSynth.playClick();
            const type = document.getElementById('admin-mutation-type').value;
            const sec = parseInt(document.getElementById('admin-mutation-time').value) || 60;
            activeMutations[type] = Date.now() + (sec * 1000);
            updateStatusEffects();
        }

        function updateMutationProb() {
            audioSynth.playClick();
            const prob = parseFloat(document.getElementById('admin-prob-mutation').value) || 10;
            mutationProb = prob;
        }

        function showAdminCharList() {
            audioSynth.playClick();
            modal.style.display = 'block';
            let html = '<h2 style="color:#00ffcc; margin-bottom:15px;">基地にキャラクターを追加</h2><div style="display:flex; flex-wrap:wrap; justify-content:center; gap:15px; max-height:500px; overflow-y:auto; padding:15px;">';
            characters.forEach(c => {
                html += `
                    <div style="background:rgba(0,0,0,0.8); padding:15px; border:1px solid ${c.color}; border-radius:5px; text-align:center; min-width: 140px;">
                        <img src="${c.img}" style="width:70px; height:70px; object-fit:contain; filter:drop-shadow(0 0 5px ${c.color});"><br>
                        <div style="color:${c.color}; font-size:0.9em; margin: 8px 0; font-weight:bold; word-wrap:break-word;">${c.name}</div>
                        <div style="font-size:0.75em; color:#ddd; margin-bottom:6px;">レア度: ${c.rarity}</div>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <button onclick="addSpecificCharToBase('${c.id}', 'normal')" style="padding:6px; font-size:0.8em;">通常追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'gold')" style="padding:6px; font-size:0.8em; color:gold; border-color:gold;">GOLD追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'diamond')" style="padding:6px; font-size:0.8em; color:cyan; border-color:cyan;">DIAMOND追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'rainbow')" style="padding:6px; font-size:0.8em; color:#ff00ff; border-color:#ff00ff;">RAINBOW追加</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            modalBody.innerHTML = html;
        }

        // キャラクター出現メッセージを表示せずにサイレント追加する関数
        function addSpecificCharToBase(charId, mutation = 'normal') {
            audioSynth.playClick();
            if (baseItems.length >= getMaxBaseCapacity()) {
                return;
            }
            let storeId = charId + ":" + mutation + ":none";
            baseItems.push(storeId);
            unlockedCharacters[charId + ":" + mutation] = true;
            saveState();
            updateUI();
            // メッセージ(alert)表示を排除
        }
    </script>
</body>
</html>
