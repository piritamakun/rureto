                <p style="color:#aaa; font-size:0.95em; line-height:1.5;">リバースを実行すると、必要なお金（$${formatMoney(cost)}）のみ消費され、<strong style="color:#0f0;">キャラクターは保持されたまま</strong><br>基地に配置したキャラクターの<strong style="color:#0f0;">「毎秒のお金稼ぎ効率」と「基地の最大所持枠」が永続的に大幅アップ</strong>します！</p>
                
                <div style="margin:20px 0; padding:20px; border:2px solid ${canRebirth ? 'var(--primary-yellow)' : '#555'}; background:rgba(0,0,0,0.5); border-radius:8px;">
                    <h3 style="margin-top:0; color:var(--primary-yellow);">次のリバース: 第 ${rebirthCount + 1} 段階</h3>
                    <p style="font-size:1.4em; color:${canRebirth ? '#0f0' : '#f00'}; font-weight:bold;">必要な費用: $${formatMoney(cost)}</p>
                    <p style="color:#fff; font-size:1.1em;">現在のお金: $${formatMoney(money)}</p>
                    <p style="color:var(--primary-cyan); font-size:0.95em;">リバース後の基地容量: <strong style="color:#0f0;">${10 + (rebirthCount + 1) * 2}枠</strong> (現在: ${getMaxBaseCapacity()}枠)</p>
                </div>
                
                <button onclick="executeRebirth()" ${!canRebirth ? 'disabled' : ''} style="font-size:1.2em; padding:12px 30px; border-color:var(--primary-yellow); color:var(--primary-yellow); margin-right:10px;">
                    リバースを実行する
                </button>
                <button onclick="closeModal()" style="font-size:1em; padding:12px 20px;">キャンセル</button>
            `;
        }

        function executeRebirth() {
            let cost = rebirthCosts[rebirthCount];
            if (money >= cost && rebirthCount < 10) {
                audioSynth.playJackpot();
                money -= cost;
                rebirthCount++;
                saveState();
                updateUI();
                openRebirthMenu();
            }
        }

        // --- 自動お金稼ぎループ ---
        setInterval(() => {
            let income = 0;
            if (baseItems.length > 0) {
                baseItems.forEach(itemStr => {
                    let parts = itemStr.split(':');
                    let charId = parts[0];
                    let charInfo = characters.find(c => c.id === charId) || characters[0];
                    
                    let baseIncome = 1;
                    if (charInfo.rarity === 'レア') baseIncome = 2;
                    else if (charInfo.rarity === 'レジェンド') baseIncome = 5;
                    else if (charInfo.rarity === 'ゴット') baseIncome = 10;
                    else if (charInfo.rarity === 'シークレット') baseIncome = 50;
                    else if (charInfo.rarity === 'サンダー') baseIncome = 100;
                    
                    let mutType = parts[1] || 'normal';
                    if (mutType === 'gold') baseIncome *= 2;
                    if (mutType === 'diamond') baseIncome *= 5;
                    if (mutType === 'rainbow') baseIncome *= 20;
                    
                    income += baseIncome;
                });
                
                // リバースボーナス (1回につき +50%)
                income = Math.floor(income * (1 + (rebirthCount * 0.5)));
                money += income;
            }
            
            document.getElementById('money-val').innerText = formatMoney(money);
            
            const incomeEl = document.getElementById('income-val');
            if (incomeEl) {

                    incomeEl.innerText = "";

            }

        function applyBuffToCharacter(index) {
            audioSynth.playClick();
            let itemStr = baseItems[index];
            let parts = itemStr.split(':');
            let charId = parts[0];
            let mutType = parts[1] || 'normal';
            let buffType = parts[2] || 'none';

            if (buffType !== 'none') {
                return;
            }

            let currentProb = getBaseBuffProbability();
            let rand = Math.random() * 100;

            if (rand < currentProb) {
                let newBuff = Math.random() < 0.5 ? 'thunder' : 'water';
                baseItems[index] = `${charId}:${mutType}:${newBuff}`;
                saveState();
                manageBaseCharacter(index); 
            }
        }

            audioSynth.playClick();
            if (baseItems.length > 0) {

        /* ============================================================
           ★ COLLECTION + BOLT EXTENSION v1（完全追加型）
           ※既存のコード／既存のP2Pトレード処理は削除せず、後付けで拡張
           ============================================================ */

        // ------------------------------------------------------------
        // BOLT変異：既存のGOLD/DIAMOND/RAINBOWの確率をそのまま維持しつつ追加
        // BOLT 0.02% / RAINBOW 0.10% / DIAMOND 0.90% / GOLD 5.00%
        // ------------------------------------------------------------
        const _originalRollMutation = rollMutation;
        rollMutation = function() {
            const rand = Math.random() * 100;
            if (rand < 0.02) return 'bolt';
            if (rand < 0.12) return 'rainbow';
            if (rand < 1.02) return 'diamond';
            if (rand < 6.02) return 'gold';
            return 'normal';
        };

        function collectionPersist() {
            try { localStorage.setItem('collectionData', JSON.stringify(collectionData)); } catch (e) {}
        }

        function collectionTodayKey() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function collectionEnsureDaily() {
            const today = collectionTodayKey();
            let changed = false;
            if (collectionData.dailyDate !== today) {
                collectionData.dailyDate = today;
                collectionData.daily = { collected: 0, newCharacters: 0, mutations: 0 };
                collectionData.dailyClaims = {};
                changed = true;
            }
            if (!collectionData.daily) { collectionData.daily = { collected: 0, newCharacters: 0, mutations: 0 }; changed = true; }
            if (!collectionData.dailyClaims) { collectionData.dailyClaims = {}; changed = true; }
            if (!collectionData.milestoneClaims) { collectionData.milestoneClaims = {}; changed = true; }
            if (!collectionData.rarityClaims) { collectionData.rarityClaims = {}; changed = true; }
            if (!collectionData.mutationClaims) { collectionData.mutationClaims = {}; changed = true; }
            return changed;
        }

        function collectionCharacterIds() {
            const valid = new Set(characters.map(c => c.id));
            const ids = new Set();
            Object.keys(unlockedCharacters || {}).forEach(k => {
                const id = String(k).split(':')[0];
                if (valid.has(id)) ids.add(id);
            });
            (baseItems || []).forEach(item => {
                const id = String(item || '').split(':')[0];
                if (valid.has(id)) ids.add(id);
            });
            return ids;
        }

        function collectionVariantKeys() {
            const valid = new Set(characters.map(c => c.id));
            const variants = new Set();
            Object.keys(unlockedCharacters || {}).forEach(k => {
                const p = String(k).split(':');
                if (valid.has(p[0])) variants.add(p[0] + ':' + (p[1] || 'normal'));
            });
            (baseItems || []).forEach(item => {
                const p = String(item || '').split(':');
                if (valid.has(p[0])) variants.add(p[0] + ':' + (p[1] || 'normal'));
            });
            return variants;
        }

        function syncCollectionStats() {
            if (!collectionData) return;
            let dirty = collectionEnsureDaily();
            const ids = collectionCharacterIds();
            const vars = collectionVariantKeys();

            if (!collectionData.initialized) {
                collectionData.seenCharacters = Array.from(ids);
                collectionData.seenVariants = Array.from(vars);
                collectionData.lastBaseCount = baseItems.length;
                collectionData.initialized = true;
                dirty = true;
            } else {
                const seenChars = new Set(collectionData.seenCharacters || []);
                const seenVars = new Set(collectionData.seenVariants || []);
                ids.forEach(id => {
                    if (!seenChars.has(id)) {
                        collectionData.daily.newCharacters += 1;
                        seenChars.add(id);
                        dirty = true;
                    }
                });
                vars.forEach(key => {
                    if (!seenVars.has(key)) {
                        const mut = key.split(':')[1] || 'normal';
                        if (mut !== 'normal') collectionData.daily.mutations += 1;
                        seenVars.add(key);
                        dirty = true;
                    }
                });
                const delta = baseItems.length - Number(collectionData.lastBaseCount || 0);
                if (delta > 0) {
                    collectionData.daily.collected += delta;
                    dirty = true;
                }
                collectionData.lastBaseCount = baseItems.length;
                collectionData.seenCharacters = Array.from(seenChars);
                collectionData.seenVariants = Array.from(seenVars);
            }
            if (dirty) collectionPersist();
        }

        function collectionHas(id, mutation='normal') {
            return !!(unlockedCharacters[id + ':' + mutation] || (mutation === 'normal' && unlockedCharacters[id]));
        }

        function collectionRarityGroups() {
            const g = {};
            characters.forEach(c => { (g[c.rarity] ||= []).push(c); });
            return g;
        }

        function collectionUniqueCount() { return collectionCharacterIds().size; }
        function collectionVariantCount() { return collectionVariantKeys().size; }

        function collectionPoints() {
            const vars = collectionVariantKeys();
            let p = collectionUniqueCount() * 100 + vars.size * 15;
            if (Array.from(vars).some(v => v.endsWith(':bolt'))) p += 500;
            return p;
        }

        function collectionRewardMilestones() {
            const total = characters.length;
            return [
                { id:'m2', count:2, reward:500, ticket:0 },
                { id:'m5', count:5, reward:1500, ticket:0 },
                { id:'m10', count:10, reward:5000, ticket:1 },
                { id:'m15', count:15, reward:12000, ticket:2 },
                { id:'mall', count:total, reward:50000, ticket:5 }
            ];
        }

        function collectionClaimMilestone(id,count,reward,ticket) {
            syncCollectionStats();
            if (collectionUniqueCount() < count || collectionData.milestoneClaims[id]) return;

            money += reward; specialTickets += ticket;

        function collectionClaimRarity(rarity,reward,ticket) {
            syncCollectionStats();
            const list = collectionRarityGroups()[rarity] || [];
            if (!list.length || !list.every(c => collectionHas(c.id,'normal')) || collectionData.rarityClaims[rarity]) return;
            collectionData.rarityClaims[rarity] = true;
            money += reward; specialTickets += ticket;
            collectionPersist(); saveState(); updateUI();
            audioSynth.playJackpot(); showCollectionMenu();
        }

        function collectionClaimMutation(mutation,reward,ticket) {
            syncCollectionStats();
            const found = Array.from(collectionVariantKeys()).some(k => (k.split(':')[1] || 'normal') === mutation);
            if (!found || collectionData.mutationClaims[mutation]) return;
            collectionData.mutationClaims[mutation] = true;
            money += reward; specialTickets += ticket;
            collectionPersist(); saveState(); updateUI();
            audioSynth.playJackpot(); showCollectionMenu();
        }

0px,1fr));gap:8px;">${newHtml}</div></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button onclick="showIndexMenu('normal')" style="border-color:#00ff66;color:#00ff66;">図鑑を開く</button><button onclick="closeModal()" style="padding:10px 20px;">閉じる</button></div></div>`;

function craftRecipeById(id){return CRAFT_RECIPES.find(r=>r.id===id)||null}

 if(recipe.requirementMode==='allRarity') return characters.filter(c=>c.rarity===recipe.rarity).map(c=>c.id);

}

}

}

 Object.keys(craftSelected).forEach(k=>{if(Number(k)!==reqIndex&&Number(craftSelected[k])===baseIndex)delete craftSelected[k]});
 if(Number(craftSelected[reqIndex])===baseIndex)delete craftSelected[reqIndex];else craftSelected[reqIndex]=baseIndex;

}

 return '<div class="craft-result-head"><img src="'+c.img+'" alt="'+c.id+'" style="filter:drop-shadow(0 0 10px '+(c.color||'#fff')+');"><div style="text-align:left;min-width:0;"><div class="craft-result-name">'+c.name+'</div><div class="craft-result-rarity" style="color:'+(c.color||'#fff')+';">レア度：'+c.rarity+'</div><div style="font-size:.68em;color:#9ab;margin-top:4px;">完成時は通常形態で生成されます</div></div></div>';

function renderCraftRecipe(){
 const recipe=craftCurrentRecipe;if(!recipe){showCraftMachine();return}
 modal.style.display='block';
 const reqs=craftRecipeRequirements(recipe), selectedIndices=craftSelectedIndices();

 reqs.forEach((id,reqIndex)=>{

  }
  reqHtml+='<div class="craft-req '+(selected>=0?'ok':'missing')+'"><img src="'+c.img+'" alt="'+c.id+'" style="filter:drop-shadow(0 0 7px '+(c.color||'#fff')+');"><div class="craft-req-main"><div class="craft-req-name">'+(reqIndex+1)+'. '+c.name+'</div><div class="craft-req-status" style="color:'+(selected>=0?'#00ff66':'#ff6b6b')+';">'+(selected>=0?'選択済み：基地 #'+(selected+1):'必要：1体を選択')+'</div><div class="craft-instance-grid">'+instancesHtml+'</div></div></div>';
 });

 modalBody.innerHTML='<div class="craft-shell"><h2 class="craft-title">⚙ CRAFT MACHINE</h2><div class="craft-sub">'+recipe.description+'</div>'+craftBuildResultCard(recipe)+'<div class="craft-cost">必要なお金：$'+formatMoney(recipe.cost)+'　｜　現在：$'+formatMoney(money)+'</div><h3 style="color:#00ffcc;margin:9px 0 6px;">必要キャラクターを選択</h3><div class="craft-req-list">'+reqHtml+'</div>'+(!canPay?'<div style="margin-top:8px;color:#ff6b6b;font-size:.75em;">お金が足りません。</div>':'')+'<div class="craft-actions"><button onclick="craftGoBack()" style="border-color:#72818e;color:#b8c0c8;">← クラフト一覧</button><button onclick="executeCraft()" '+(canCraft?'':'disabled')+' style="border-color:#00ff66;color:#00ff66;">⚡ '+(canCraft?'クラフト実行':'条件をそろえてください')+'</button></div><div class="craft-machine-footer">選んだキャラクターの個体だけが素材として消費されます。GOLD / DIAMOND / RAINBOW / BOLT ⚡やバフ付き個体も素材にできます。</div></div>';
}
function showCraftMachine(){
 audioSynth.playClick();craftCurrentRecipe=null;craftResetSelection();modal.style.display='block';
 let left='';
 CRAFT_RECIPES.forEach(recipe=>{
  const c=craftResultInfo(recipe), available=craftHasAll(recipe);
  left+='<button class="craft-recipe-btn" onclick="craftOpenRecipe(\''+recipe.id+'\')" style="border-color:'+(c.color||'#00ffcc')+';color:'+(c.color||'#00ffcc')+';"><img src="'+c.img+'" alt="'+c.id+'" style="filter:drop-shadow(0 0 8px '+(c.color||'#fff')+');"><span class="craft-btn-text"><span class="craft-btn-name">'+c.name+'</span><span class="craft-btn-rarity">'+c.rarity+'</span><span class="craft-btn-cost">クラフト費用 $'+formatMoney(recipe.cost)+'　'+(available?'● 素材あり':'○ 素材不足')+'</span></span></button>';
 });
 modalBody.innerHTML='<div class="craft-shell"><h2 class="craft-title">⚙ CRAFT MACHINE</h2><div class="craft-sub">左側の「作れるキャラクター」を押すと、必要素材を1体ずつ選択できます。</div><div class="craft-machine"><div class="craft-left"><h3>🧪 作れるキャラクター</h3>'+left+'</div><div class="craft-right"><div class="craft-preview-empty">キャラクターを選択してください<br>必要素材 → 選択 → 支払い → クラフト</div></div></div><div class="craft-machine-footer">現在のレシピは3種類。クラフトで素材を消費して、コレクションを増やせます。</div><div class="craft-actions"><button onclick="closeModal()" style="padding:10px 18px;">閉じる</button></div></div>';
}
function executeCraft(){
 if(craftBusy||!craftCurrentRecipe)return;
 const recipe=craftCurrentRecipe,reqs=craftRecipeRequirements(recipe),selected=craftSelectedIndices();
 if(selected.length!==reqs.length||money<recipe.cost){renderCraftRecipe();return}
 const unique=new Set(selected);
 if(unique.size!==selected.length){craftResetSelection();renderCraftRecipe();return}
 for(let i=0;i<reqs.length;i++){
  const idx=Number(craftSelected[i]);
  if(!Number.isInteger(idx)||idx<0||idx>=baseItems.length||craftItemParts(baseItems[idx]).id!==reqs[i]){craftResetSelection();renderCraftRecipe();return}
 }
 const result=craftFindChar(recipe.resultId);if(!result||!result.id)return;
 craftBusy=true;
 selected.slice().sort((a,b)=>b-a).forEach(idx=>{if(idx>=0&&idx<baseItems.length)baseItems.splice(idx,1)});
 money-=recipe.cost;
 baseItems.push(result.id+':normal:none');
 unlockedCharacters[result.id+':normal']=true;
 try{saveState()}catch(e){console.error('Craft save error:',e)}
 try{updateUI()}catch(e){}
 try{if(typeof syncCollectionStats==='function')syncCollectionStats();if(typeof collectionPersist==='function')collectionPersist()}catch(e){}
 try{audioSynth.playJackpot()}catch(e){}
 modalBody.innerHTML='<div class="craft-shell craft-success"><h2 class="craft-title" style="color:#00ff66;">⚡ CRAFT COMPLETE ⚡</h2><div style="margin:8px 0 13px;color:#fff;">素材を消費してキャラクターを生成しました！</div><div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;border:2px solid '+(result.color||'#00ff66')+';border-radius:14px;background:rgba(0,255,102,.06);"><img src="'+result.img+'" style="width:160px;height:160px;object-fit:contain;filter:drop-shadow(0 0 22px '+(result.color||'#00ff66')+');"><div style="font-size:1.2em;font-weight:bold;color:'+(result.color||'#fff')+';margin-top:5px;">'+result.name+'</div><div style="margin-top:3px;color:#fff;">'+result.rarity+'</div><div style="font-size:.75em;color:#9ab;margin-top:8px;">基地に追加済み　｜　保存済み</div></div><div class="craft-actions"><button onclick="showCraftMachine()" style="border-color:#00ffcc;color:#00ffcc;">クラフト一覧へ</button><button onclick="showBaseMenu()" style="border-color:#b967ff;color:#b967ff;">基地を確認</button></div></div>';
 craftCurrentRecipe=null;craftResetSelection();setTimeout(()=>{craftBusy=false},700);
}

window.showCraftMachine=showCraftMachine;
window.craftOpenRecipe=craftOpenRecipe;
window.craftSelectInstance=craftSelectInstance;
window.craftGoBack=craftGoBack;
window.executeCraft=executeCraft;

const arrow=document.createElement('button');
arrow.id='craft-arrow-btn';arrow.type='button';arrow.innerHTML='→';arrow.title='クラフトマシーン';arrow.setAttribute('aria-label','クラフトマシーン');
arrow.addEventListener('click',showCraftMachine);document.body.appendChild(arrow);

if(typeof showCollectionMenu==='function'){

 window.__legacyCollectionMenu=legacyCollectionMenu;
}

/* ============================================================
   TRADE STABILITY EXTENSION v3
   ・送信キュー
   ・接続維持PING
   ・OK/実行の二重処理ロック
   ・最新基地状態の再検証
   ============================================================ */
let tradeSafeBusy=false,tradeSafeSignature='',tradeLastPingAt=0,tradeLastPongAt=Date.now();

function installTradeConnectionGuard(conn){
 if(!conn||conn.__piritamaStableGuard)return;
 conn.__piritamaStableGuard=true;
 const nativeSend=conn.send.bind(conn),queue=[];let flushing=false;
 conn.__piritamaSend=function(payload){
  if(conn.open){try{nativeSend(payload);return true}catch(e){}}
  if(queue.length<40)queue.push(payload);return false;
 };
 conn.send=function(payload){return conn.__piritamaSend(payload)};
 const flush=()=>{
  if(flushing||!conn.open)return;
  flushing=true;
  try{while(queue.length&&conn.open){const payload=queue.shift();try{nativeSend(payload)}catch(e){queue.unshift(payload);break}}}
  finally{flushing=false}
 };
 if(conn.open)setTimeout(flush,0);else conn.on('open',flush);
 conn.on('data',data=>{
  if(!data||typeof data!=='object')return;
  if(data.type==='PIRITAMA_TRADE_PING'){try{conn.send({type:'PIRITAMA_TRADE_PONG',ts:data.ts||Date.now()})}catch(e){}}
  else if(data.type==='PIRITAMA_TRADE_PONG')tradeLastPongAt=Date.now();
 });
 conn.on('close',()=>{queue.length=0});
 conn.on('error',()=>{});
}

if(typeof setupConnectionListeners==='function'){
 const originalSetupConnectionListeners=setupConnectionListeners;
 setupConnectionListeners=function(conn){
  installTradeConnectionGuard(conn);
  originalSetupConnectionListeners(conn);
  installTradeConnectionGuard(conn);
 };
}
if(typeof resetTradeState==='function'){
 const originalResetTradeState=resetTradeState;
 window.resetTradeState=function(){
  tradeSafeBusy=false;tradeSafeSignature='';craftBusy=false;
  return originalResetTradeState.apply(this,arguments);
 };
}
if(typeof checkAndExecuteTrade==='function'){
 const originalCheckAndExecuteTrade=checkAndExecuteTrade;
 window.checkAndExecuteTrade=function(){
  if(tradeSafeBusy||tradeFinalized)return;
  if(!(myTradeOk&&peerTradeOk&&activeConn&&activeConn.open))return;
  const giveIdx=mySelectedTradeIndices.filter(i=>Number.isInteger(i)&&i>=0&&i<baseItems.length);
  const giveList=giveIdx.map(i=>baseItems[i]);
  const getList=sanitizeTradeList(peerSelectedTradeChars);
  if(giveIdx.length!==mySelectedTradeIndices.length||giveList.some(v=>typeof v!=='string')||getList.length!==peerSelectedTradeChars.length){
   myTradeOk=false;peerTradeOk=false;
   try{activeConn.send({type:'SELECT_CHARS',chars:giveList})}catch(e){}
   tradeSetNotice('安全確認で選択状態のズレを検出しました。もう一度選び直してください。','var(--primary-yellow)');
   renderTradeUI();return;
  }
  const signature=JSON.stringify({room:currentRoomCode,mine:giveList,peer:getList});
  if(signature===tradeSafeSignature)return;
  tradeSafeBusy=true;tradeSafeSignature=signature;
  try{originalCheckAndExecuteTrade()}catch(e){
   console.error('Trade execution guard error:',e);tradeSafeBusy=false;tradeSafeSignature='';
   myTradeOk=false;peerTradeOk=false;tradeSetNotice('交換処理を安全に停止しました。もう一度OKしてください。','#ff6b6b');
   try{renderTradeUI()}catch(_){}
   return;
  }
  setTimeout(()=>{tradeSafeBusy=false;if(!tradeFinalized)tradeSafeSignature=''},1200);
 };
}
if(typeof toggleMyOk==='function'){
 const originalToggleMyOk=toggleMyOk;
 window.toggleMyOk=function(){
  if(tradeFinalized)return;
  if(!activeConn||!activeConn.open){
   tradeSetNotice('通信がまだ確立していません。少し待ってからOKしてください。','#ff6b6b');
   renderTradeUI();return;
  }
  return originalToggleMyOk.apply(this,arguments);
 };
}

setInterval(()=>{
 try{
  if(activeConn&&activeConn.open&&currentRoomCode&&!tradeFinalized){
   tradeLastPingAt=Date.now();
   activeConn.send({type:'PIRITAMA_TRADE_PING',ts:tradeLastPingAt});
  }
 }catch(e){}
},4000);

setInterval(()=>{
 try{if(peer&&peer.disconnected&&!peer.destroyed)peer.reconnect()}catch(e){}
},5000);

})();
</script>

<script id="piritama-v2-script">
(function(){
'use strict';

/* ============================================================
   1) リバース：15段階・費用アップ・キャラクター素材必須

   ============================================================ */
const REBIRTH_V2_MAX = 15;
const REBIRTH_V2_COSTS = [
    2000,12000,35000,70000,150000,
    250000,400000,600000,900000,1300000,
    2000000,3000000,4500000,7000000,12000000
];
const REBIRTH_V2_REQS = [
    [{rarity:'アンコモン',count:1}],
    [{rarity:'レア',count:1}],
    [{rarity:'レジェンド',count:1}],
    [{rarity:'ゴット',count:1}],
    [{rarity:'シークレット',count:1}],
    [{rarity:'サンダー',count:1}],
    [{rarity:'シークレット',count:2}],
    [{rarity:'ゴット',count:2}],
    [{rarity:'サンダー',count:2}],
    [{rarity:'シークレット',count:1},{rarity:'ゴット',count:1}],
    [{rarity:'シークレット',count:2},{rarity:'サンダー',count:1}],
    [{rarity:'ゴット',count:2},{rarity:'サンダー',count:1}],
    [{rarity:'シークレット',count:3},{rarity:'ゴット',count:1}],
    [{rarity:'ゴット',count:2},{rarity:'サンダー',count:2}],
    [{rarity:'シークレット',count:3},{rarity:'ゴット',count:2},{rarity:'サンダー',count:2}]
];
function rebirthV2Capacity(){ return 10; }
getMaxBaseCapacity = rebirthV2Capacity;
function rebirthV2MutationRank(item){
    const p=String(item||'').split(':');
    const mut=p[1]||'normal', buff=p[2]||'none';
    const m={normal:0,gold:1,diamond:2,rainbow:3,bolt:4}[mut]??0;
    return m*10+(buff==='none'?0:1);
}
function rebirthV2PickMaterials(reqs){
    const used=new Set(),picked=[];
    for(const req of reqs){
        let need=req.count;
        const candidates=[];
        for(let i=0;i<baseItems.length;i++){
            if(used.has(i))continue;
            const p=String(baseItems[i]||'').split(':');
            const c=characters.find(x=>x.id===p[0]);
            if(c && c.rarity===req.rarity)candidates.push(i);
        }
        candidates.sort((a,b)=>rebirthV2MutationRank(baseItems[a])-rebirthV2MutationRank(baseItems[b]));
        for(const idx of candidates){
            if(need<=0)break;
            used.add(idx);picked.push(idx);need--;
        }
        if(need>0)return null;
    }
    return picked;
}
function rebirthV2ReqText(req){
    return req.map(x=>x.rarity+' × '+x.count).join(' ＋ ');
}
function openRebirthMenuV2(){
    audioSynth.playClick();

        modalBody.innerHTML='<div class="rebirth-v2-box"><h2 style="color:var(--primary-yellow);">REBIRTH Lv.15</h2><p style="color:#fff;font-size:1.1em;font-weight:bold;">リバースは最大15段階までです。</p><p style="color:#9ab;">基地容量はリバース回数で増加しません。最大10枠のままです。</p><button onclick="closeModal()">閉じる</button></div>';
        return;
    }
    const cost=REBIRTH_V2_COSTS[n];
    const reqs=REBIRTH_V2_REQS[n];
    const picked=rebirthV2PickMaterials(reqs);
    const canMoney=money>=cost, canChars=!!picked, can=canMoney&&canChars;
    let rows='';
    reqs.forEach((r,ri)=>{
        const available=(baseItems||[]).filter(item=>{
            const p=String(item||'').split(':');const c=characters.find(x=>x.id===p[0]);return c&&c.rarity===r.rarity;
        }).length;
        rows+='<div class="rebirth-v2-material '+(available>=r.count?'ok':'missing')+'"><div style="flex:1;text-align:left;"><b style="color:#fff;">'+r.rarity+'</b><span style="color:#ffd700;"> × '+r.count+'</span><div style="font-size:.68em;color:'+(available>=r.count?'#00ff66':'#ff6b6b')+';">所持：'+available+' / 必要：'+r.count+'</div></div></div>';
    });
    modalBody.innerHTML='<div style="max-height:78vh;overflow-y:auto;padding-right:4px;"><h2 style="color:var(--primary-yellow);">REBIRTH Lv.'+(n+1)+'</h2><p style="color:#aaa;font-size:.84em;line-height:1.6;margin-top:0;">リバースすると<strong style="color:#ffd700;">お金と指定キャラクター素材</strong>を消費します。その他の基地キャラクターは保持されます。<br><strong style="color:#00ff66;">基地容量は10枠で固定</strong>です。</p><div class="rebirth-v2-box"><div style="font-size:1.25em;color:#ffd700;font-weight:bold;">必要なお金：$'+formatMoney(cost)+'</div><div style="font-size:.8em;color:'+(canMoney?'#00ff66':'#ff6b6b')+';margin-top:3px;">現在のお金：$'+formatMoney(money)+'</div><div style="margin-top:11px;font-weight:bold;color:#00ffcc;">必要キャラクター：'+rebirthV2ReqText(reqs)+'</div>'+rows+'<div style="margin-top:8px;color:#8cf7ff;font-size:.68em;">素材は通常形態を優先して自動選択します。変異・バフ付きしかない場合はそれを使用します。</div></div><div style="padding:10px;border:1px solid #304052;border-radius:9px;background:rgba(0,0,0,.35);color:#fff;font-size:.78em;">現在の基地：<b style="color:#ffd700;">'+baseItems.length+' / 10</b>　｜　リバース後も <b style="color:#00ff66;">10枠</b></div><button onclick="executeRebirth()" '+(can?'':'disabled')+' style="margin-top:14px;font-size:1.08em;padding:12px 28px;border-color:var(--primary-yellow);color:var(--primary-yellow);">'+(can?'⚡ リバースを実行':'素材またはお金が不足')+'</button><button onclick="closeModal()" style="margin-left:8px;">キャンセル</button></div>';
}
function executeRebirthV2(){
    if((Number(rebirthCount)||0)>=REBIRTH_V2_MAX)return;
    const n=Math.max(0,Number(rebirthCount)||0),cost=REBIRTH_V2_COSTS[n],reqs=REBIRTH_V2_REQS[n];
    const picked=rebirthV2PickMaterials(reqs);

    /* 最終確認：インデックスとレア度をもう一度検証してから消費 */
    const pickedSet=new Set(picked);

        openRebirthMenuV2();return;
    }
    const needRarity=[];reqs.forEach(r=>{for(let k=0;k<r.count;k++)needRarity.push(r.rarity)});
    const actual=picked.map(i=>{const p=String(baseItems[i]).split(':');const c=characters.find(x=>x.id===p[0]);return c?c.rarity:''}).sort();
    const expected=needRarity.slice().sort();
    if(JSON.stringify(actual)!==JSON.stringify(expected)){openRebirthMenuV2();return;}
    const consumed=picked.map(i=>baseItems[i]);
    audioSynth.playJackpot();
    picked.slice().sort((a,b)=>b-a).forEach(i=>baseItems.splice(i,1));
    money-=cost;
    rebirthCount=n+1;
    saveState();updateUI();
    let names=consumed.map(x=>{const c=characters.find(y=>y.id===String(x).split(':')[0]);return c?c.name:'?'}).join('、');
    modalBody.innerHTML='<div class="rebirth-v2-box" style="text-align:center;border-color:#00ff66;box-shadow:0 0 22px rgba(0,255,102,.2);"><h2 style="color:#00ff66;text-shadow:0 0 15px #00ff66;">⚡ REBIRTH COMPLETE ⚡</h2><p style="color:#fff;">第'+rebirthCount+'段階のリバースに成功しました！</p><div style="color:#ffd700;font-weight:bold;">支払い：$'+formatMoney(cost)+'</div><div style="color:#8cf7ff;font-size:.76em;margin-top:7px;">消費素材：'+names+'</div><div style="margin-top:9px;color:#00ff66;">基地容量：10枠（リバースでは増加しません）</div><div style="margin-top:13px;"><button onclick="openRebirthMenu()" style="border-color:var(--primary-yellow);color:var(--primary-yellow);">次のリバースを見る</button><button onclick="showBaseMenu()" style="border-color:var(--primary-pink);color:var(--primary-pink);">基地を見る</button></div></div>';
}
openRebirthMenu = openRebirthMenuV2;
executeRebirth = executeRebirthV2;
window.openRebirthMenu=openRebirthMenuV2;
window.executeRebirth=executeRebirthV2;

/* ============================================================
   2) クラフト：レシピ2つ追加 + 変異/バフ継承
   ============================================================ */
const CRAFT_EXTRA_RECIPES=[
 {id:'legend_pair_to_burokku',title:'レジェンド2種類 → Burokku Burokku',resultId:'burokku_burokku',cost:140000,requiredIds:['mane_mane_rabitto','pipi_kora'],description:'Manē Manē Rabitto と Pīpī Kōra を1体ずつ使い、Burokku Burokku を生成します。'},
 {id:'secret_pair_god_to_pipikora',title:'シークレット2種類＋ゴット → Pīpī Kōra',resultId:'pipi_kora',cost:220000,requiredIds:['suta_banana','wota_cheri','kaminari'],description:'Sutā Banana、Wōta Cherī、Kaminari を1体ずつ使い、Pīpī Kōra を生成します。'}
];
let craftV2ExtraCurrent=null,craftV2ExtraSelected=[];
function craftV2Char(id){return characters.find(c=>c.id===id)||characters[0]}
function craftV2Parts(item){const p=String(item||'').split(':');return{id:p[0],mut:p[1]||'normal',buff:p[2]||'none'}}
function craftV2VariantLabels(item){const p=craftV2Parts(item);const a=[];if(p.mut!=='normal')a.push(p.mut.toUpperCase());if(p.buff!=='none')a.push(p.buff.toUpperCase());return a.join(' / ')||'NORMAL'}
function craftV2PickedItems(){return craftV2ExtraSelected.map(i=>baseItems[i]).filter(Boolean)}
function craftV2RollVariant(items){
    const muts=[],buffs=[];
    items.forEach(item=>{const p=craftV2Parts(item);if(p.mut!=='normal')muts.push(p.mut);if(p.buff!=='none')buffs.push(p.buff)});
    let mut='normal',buff='none';
    if(muts.length && Math.random()<0.08){
        const weights={gold:60,diamond:25,rainbow:12,bolt:3},pool=[];muts.forEach(m=>{pool.push(m)});
        let sum=0;pool.forEach(m=>sum+=weights[m]||1);let r=Math.random()*sum;for(const m of pool){r-=weights[m]||1;if(r<=0){mut=m;break;}}
    }
    if(buffs.length && Math.random()<0.08)buff=buffs[Math.floor(Math.random()*buffs.length)];

}
function craftV2ApplyVisual(itemStr,root){
    const p=craftV2Parts(itemStr);if(!root)return;
    const img=root.querySelector('img');
    if(img){
        if(p.mut==='gold')img.classList.add('filter-gold');

}
function craftV2RenderExtra(){

}
function craftV2SelectInstance(ri,idx){
    if(!craftV2ExtraCurrent||!Number.isInteger(idx)||idx<0||idx>=baseItems.length)return;

function executeCraftV2(){
    const r=craftV2ExtraCurrent;if(!r)return;

    craftV2ApplyVisual(resultStr,modalBody.querySelector('.craft-success'));craftV2ExtraCurrent=null;craftV2ExtraSelected=[];setTimeout(()=>{craftBusy=false},700);
}
/* 既存3レシピをそのまま使い、一覧に2レシピだけ追加 */
const _craftV2OriginalShowMachine=window.showCraftMachine;

};

if(typeof _craftV2SelectInstance==='function')craftSelectInstance=function(ri,idx){

};
if(typeof _craftV2GoBack==='function')craftGoBack=function(){craftV2Shadow={};return _craftV2GoBack()};
if(typeof _craftV2ExecuteCraft==='function')executeCraft=function(){

    const beforeLen=baseItems.length;

/* ============================================================
   3) P2P：iPad / PC を意識した接続安定化
   ・STUNを増やす
   ・iceCandidatePoolSize
   ・ゲストを自動再試行
   ・peer-unavailable時の古いactiveConn判定を改善
   ・接続メタデータで部屋を確認
   ・接続直後にスナップショットを送る
   ============================================================ */
const P2P_V2_ICE=[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:stun2.l.google.com:19302'},
    {urls:'stun:stun.cloudflare.com:3478'}
];
function p2pV2PeerOptions(){return{debug:1,config:{iceServers:P2P_V2_ICE,iceTransportPolicy:'all',iceCandidatePoolSize:10}}}
let p2pV2JoinTimer=null,p2pV2JoinAttempt=0,p2pV2SessionToken='';
function p2pV2ClearJoinTimer(){if(p2pV2JoinTimer){clearTimeout(p2pV2JoinTimer);p2pV2JoinTimer=null}}
function p2pV2Session(){if(!p2pV2SessionToken)p2pV2SessionToken=(crypto&&crypto.randomUUID)?crypto.randomUUID():('s-'+Date.now()+'-'+Math.random().toString(36).slice(2));return p2pV2SessionToken}
function p2pV2SendHello(conn){if(!conn||!conn.open)return;try{conn.send({type:'PIRITAMA_TRADE_HELLO_V2',room:currentRoomCode,from:myUserId,session:p2pV2Session()})}catch(e){}}
function p2pV2Attach(conn){
    if(!conn||conn.__piritamaV2Attached)return;conn.__piritamaV2Attached=true;
    conn.on('data',data=>{
        if(!data||typeof data!=='object')return;
        if(data.type==='PIRITAMA_TRADE_HELLO_V2'){
            if(currentRoomCode && String(data.room||'')!==String(currentRoomCode))return;
            try{conn.send({type:'PIRITAMA_TRADE_HELLO_ACK_V2',room:currentRoomCode,session:p2pV2Session()})}catch(e){}
            setTimeout(()=>{try{if(conn.open){conn.send({type:'SELECT_CHARS',chars:myTradeOffer()});conn.send({type:'TOGGLE_OK',ok:false,mine:myTradeOffer(),theirs:peerSelectedTradeChars.slice()});}}catch(e){}},40);
        } else if(data.type==='PIRITAMA_TRADE_HELLO_ACK_V2'){
            if(String(data.room||currentRoomCode)!==String(currentRoomCode))return;
        }
    });
    conn.on('open',()=>{p2pV2SendHello(conn)});
    const pc=conn.peerConnection;
    if(pc){
        const check=()=>{
            const st=pc.connectionState||pc.iceConnectionState;
            if(st==='failed')tradeSetNotice('P2Pの経路を再確立しています…','#ffd700');
        };
        pc.addEventListener&&pc.addEventListener('connectionstatechange',check);
        pc.addEventListener&&pc.addEventListener('iceconnectionstatechange',check);
    }
}
function p2pV2SetupPeer(customPeerId){
    p2pV2ClearJoinTimer();
    if(peer){try{peer.destroy()}catch(e){}}
    const id=customPeerId||myUserId;
    peer=new Peer(id,p2pV2PeerOptions());peerReady=false;
    peer.on('open',()=>{peerReady=true;});
    peer.on('close',()=>{peerReady=false});
    peer.on('disconnected',()=>{try{if(peer&&!peer.destroyed)peer.reconnect()}catch(e){}});
    peer.on('connection',conn=>{
        if(currentRoomCode && conn.metadata && conn.metadata.room && String(conn.metadata.room)!==String(currentRoomCode)){try{conn.close()}catch(e){}return}
        if(activeConn && activeConn!==conn && activeConn.open){try{conn.send({type:'ROOM_FULL'});conn.close()}catch(e){}return}
        activeConn=conn;p2pV2Attach(conn);
        if(typeof setupConnectionListeners==='function')setupConnectionListeners(conn);
        renderTradeUI();
    });
    peer.on('error',err=>{
        console.error('P2P v2 Peer Error:',err);
        if(err&&err.type==='unavailable-id'&&isHost){setTimeout(()=>{try{createTradeRoom()}catch(e){}},300);return}
        if(err&&err.type==='peer-unavailable'&&!isHost&&currentRoomCode){
            if(activeConn&&!activeConn.open){try{activeConn.close()}catch(e){}activeConn=null}
            tradeSetNotice('相手の部屋を確認しています…','#ffd700');renderTradeUI();
        }
    });
}
function p2pV2Join(code,attempt){
    p2pV2JoinAttempt=attempt||0;p2pV2ClearJoinTimer();
    if(peer){try{peer.destroy()}catch(e){}}
    activeConn=null;peerReady=false;isHost=false;currentRoomCode=code;p2pV2SessionToken='';
    const guestPeer=new Peer(undefined,p2pV2PeerOptions());peer=guestPeer;
    guestPeer.on('open',()=>{
        peerReady=true;
        const conn=guestPeer.connect('trade-room-'+code,{reliable:true,serialization:'json',metadata:{room:code,userId:myUserId,client:'ipad-pc-stable-v2'}});
        activeConn=conn;
        let opened=false;
        const failOnce=()=>{
            if(opened)return;
            if(p2pV2JoinAttempt<1){
                try{guestPeer.destroy()}catch(e){}
                activeConn=null;tradeSetNotice('接続を再試行しています…','#ffd700');renderTradeUI();
                setTimeout(()=>p2pV2Join(code,p2pV2JoinAttempt+1),900);
            }else{
                try{guestPeer.destroy()}catch(e){}activeConn=null;
                tradeSetNotice('接続できませんでした。相手が部屋を開いているか、2台ともオンラインか確認してください。','#ff8888');
                resetTradeState();setupPeer();renderTradeUI();
            }
        };
        p2pV2JoinTimer=setTimeout(failOnce,18000);
        conn.on('open',()=>{
            opened=true;p2pV2ClearJoinTimer();activeConn=conn;p2pV2SessionToken='';p2pV2Attach(conn);
            if(typeof setupConnectionListeners==='function')setupConnectionListeners(conn);
            p2pV2SendHello(conn);renderTradeUI();
        });
        conn.on('error',()=>{p2pV2ClearJoinTimer();failOnce()});
        conn.on('close',()=>{if(!tradeFinalized&&!opened){p2pV2ClearJoinTimer();failOnce()}});
    });
    guestPeer.on('error',err=>{
        console.error('P2P v2 Guest Error:',err);
        if(err&&['peer-unavailable','network','socket-error','server-error','disconnected'].includes(err.type)){p2pV2ClearJoinTimer();if(activeConn&&!activeConn.open)activeConn=null;if(p2pV2JoinAttempt<1)setTimeout(()=>p2pV2Join(code,p2pV2JoinAttempt+1),900);else{tradeSetNotice('P2P接続に失敗しました。部屋番号と通信環境を確認してください。','#ff8888');resetTradeState();setupPeer();renderTradeUI()}}else{tradeSetNotice('P2P通信エラーが発生しました。もう一度お試しください。','#ff8888');renderTradeUI()}
    });
    renderTradeUI();
}
/* createTradeRoom は既存コードを利用し、setupPeerだけ強化版へ差し替え */
setupPeer=p2pV2SetupPeer;window.setupPeer=p2pV2SetupPeer;
const _joinTradeRoomV2Original=window.joinTradeRoom;
window.joinTradeRoom=function(){
    audioSynth.playClick();
    const input=document.getElementById('join-room-id');if(!input)return;
    const code=input.value.trim();
    if(!/^\d{4}$/.test(code)){tradeSetNotice('部屋番号は「4桁の数字」で入力してください。','#ff8888');renderTradeUI();return;}
    resetTradeState();tradeLastResult=null;currentRoomCode=code;isHost=false;p2pV2JoinAttempt=0;p2pV2Join(code,0);
};
if(typeof window.setupConnectionListeners==='function'){
    const _setupConnV2=window.setupConnectionListeners;
    setupConnectionListeners=function(conn){
        p2pV2Attach(conn);const r=_setupConnV2(conn);setTimeout(()=>{try{if(conn&&conn.open)p2pV2SendHello(conn)}catch(e){}},0);return r;
    };
}
/* P2Pステータス表示をトレード画面の先頭へ後付け */
const _renderTradeUIV2Base=window.renderTradeUI;
if(typeof _renderTradeUIV2Base==='function'){
    renderTradeUI=function(){
        const r=_renderTradeUIV2Base();
        const tr=modalBody.querySelector('.tr2');
        if(tr && !tr.querySelector('.p2p-v2-status')){
            const bar=tr.querySelector('.tr2-bar');
            if(bar){const s=document.createElement('span');s.className='p2p-v2-status';s.style.color=(activeConn&&activeConn.open)?'#00ff66':'#ffd700';s.textContent=(activeConn&&activeConn.open)?'P2P 安定接続':'P2P 接続待機';bar.insertBefore(s,bar.firstChild)}
        }
        return r;
    };
}
})();
</script>

/* ------------------------------------------------------------
   2) リバース後の基地保管量
   ・初期10枠
   ・リバース1回ごとに+2枠
   ・最大REBIRTH Lv.15で40枠
   ・リバース素材消費以外の既存基地データは保持
   ------------------------------------------------------------ */
const REBIRTH_V3_BASE_CAPACITY=10;
const REBIRTH_V3_PER_LEVEL=2;
const REBIRTH_V3_MAX_LEVEL=15;
function rebirthV3Capacity(){
    const n=Math.min(Math.max(Number(rebirthCount)||0,0),REBIRTH_V3_MAX_LEVEL);
    return REBIRTH_V3_BASE_CAPACITY + n*REBIRTH_V3_PER_LEVEL;
}
function rebirthV3NextCapacity(){
    const n=Math.min(Math.max(Number(rebirthCount)||0,0),REBIRTH_V3_MAX_LEVEL);
    return REBIRTH_V3_BASE_CAPACITY + Math.min(n+1,REBIRTH_V3_MAX_LEVEL)*REBIRTH_V3_PER_LEVEL;
}
getMaxBaseCapacity=rebirthV3Capacity;
window.getMaxBaseCapacity=rebirthV3Capacity;

/* リバース画面を動的な容量表示へ再ラップ */
const rebirthV3OpenBase=window.openRebirthMenu;
window.openRebirthMenu=function(){
    if(typeof rebirthV3OpenBase==='function')rebirthV3OpenBase();
    try{
        const cap=rebirthV3Capacity();
        const next=rebirthV3NextCapacity();
        const n=Math.min(Math.max(Number(rebirthCount)||0,0),REBIRTH_V3_MAX_LEVEL);
        if(!modalBody)return;
        if(n>=REBIRTH_V3_MAX_LEVEL){
            modalBody.innerHTML=modalBody.innerHTML
                .replace('基地容量はリバース回数で増加しません。最大10枠のままです。','基地容量はリバース1回ごとに2枠増加しました。現在は<b style="color:#00ff66;">'+cap+'枠</b>です。')
                .replace('基地容量は10枠で固定','基地容量はリバース1回ごとに2枠増加');
        }else{
            modalBody.innerHTML=modalBody.innerHTML
                .replaceAll('基地容量は10枠で固定','基地容量はリバース1回ごとに2枠増加します')
                .replaceAll('基地容量はリバース回数で増加しません。最大10枠のままです。','基地容量はリバース1回ごとに2枠増加します。')
                .replaceAll(''+(baseItems.length)+' / 10</b>',''+(baseItems.length)+' / '+cap+'</b>')
                .replaceAll('>10枠</b>','>'+cap+'枠</b>')
                .replaceAll('リバース後も <b style="color:#00ff66;">10枠</b>','リバース後は <b style="color:#00ff66;">'+next+'枠</b>')
                .replaceAll('リバース後も <b style="color:#00ff66;">10枠</b>','リバース後は <b style="color:#00ff66;">'+next+'枠</b>');
        }
    }catch(e){console.error('Rebirth capacity UI patch:',e);}
};

/* リバース完了画面の容量表示も更新 */
const rebirthV3ExecuteBase=window.executeRebirth;
window.executeRebirth=function(){
    const before=Number(rebirthCount)||0;
    const ret=typeof rebirthV3ExecuteBase==='function'?rebirthV3ExecuteBase.apply(this,arguments):undefined;
    try{
        if(modalBody && (Number(rebirthCount)||0)>before){
            const cap=rebirthV3Capacity();
            modalBody.innerHTML=modalBody.innerHTML
                .replaceAll('基地容量：10枠（リバースでは増加しません）','基地容量：'+cap+'枠（リバースで+2枠）')
                .replaceAll('基地容量：10枠','基地容量：'+cap+'枠');
        }
    }catch(e){console.error('Rebirth result capacity patch:',e);}
    return ret;
};

/* 既存関数から参照される可能性に備えてグローバル関数名も同期 */
