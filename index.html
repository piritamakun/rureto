<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サイバールーレットシステム - Kaminari Update Deluxe & Rebirth</title>
    <!-- PeerJS P2P通信ライブラリ -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        /* サイバーパンク風の全体スタイル & アニメーション背景 */
        :root {
            --primary-cyan: #00ffff;
            --primary-pink: #ff00ff;
            --primary-yellow: #ffd700;
            --primary-green: #00ff66;
            --bg-dark: #030712;
            --panel-bg: rgba(6, 18, 36, 0.85);
            --border-glow: rgba(0, 255, 255, 0.4);
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Courier New', Courier, 'Hiragino Kaku Gothic ProN', 'Meiryo', monospace;
            background-color: var(--bg-dark);
            color: var(--primary-cyan);
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            position: relative;
        }

        /* スキャンラインエフェクト */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 左上メニューボタン */
        #menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 60;
            background: rgba(0, 20, 40, 0.85);
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 12px 20px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4), inset 0 0 8px rgba(0, 255, 255, 0.2);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        #menu-btn:hover {
            background: rgba(0, 255, 255, 0.25);
            box-shadow: 0 0 20px var(--primary-cyan), inset 0 0 12px var(--primary-cyan);
            transform: translateY(-2px) scale(1.02);
            text-shadow: 0 0 8px var(--primary-cyan);
        }
        #menu-btn:active {
            transform: translateY(1px) scale(0.96);
        }

        /* 画面左真ん中 インデックスボタン */
        #index-btn {
            position: absolute;
            top: 38%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(0, 40, 20, 0.85);
            color: var(--primary-green);
            border: 1px solid var(--primary-green);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4), inset 0 0 8px rgba(0, 255, 102, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #index-btn:hover {
            background: rgba(0, 255, 102, 0.25);
            box-shadow: 0 0 20px var(--primary-green), inset 0 0 12px var(--primary-green);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-green);
        }
        #index-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 画面左真ん中 トレードボタン（インデックスボタンの下） */
        #trade-btn {
            position: absolute;
            top: 58%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(40, 0, 40, 0.85);
            color: var(--primary-pink);
            border: 1px solid var(--primary-pink);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 0, 255, 0.4), inset 0 0 8px rgba(255, 0, 255, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #trade-btn:hover {
            background: rgba(255, 0, 255, 0.25);
            box-shadow: 0 0 20px var(--primary-pink), inset 0 0 12px var(--primary-pink);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-pink);
        }
        #trade-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 左側下部 リバースボタン */
        #rebirth-btn {
            position: absolute;
            top: 78%;
            left: 20px;
            transform: translateY(-50%);
            z-index: 60;
            background: rgba(40, 20, 0, 0.85);
            color: var(--primary-yellow);
            border: 1px solid var(--primary-yellow);
            padding: 25px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4), inset 0 0 8px rgba(255, 215, 0, 0.2);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            letter-spacing: 4px;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            clip-path: polygon(100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px), 0 0, calc(100% - 10px) 0);
        }
        #rebirth-btn:hover {
            background: rgba(255, 215, 0, 0.25);
            box-shadow: 0 0 20px var(--primary-yellow), inset 0 0 12px var(--primary-yellow);
            transform: translateY(-50%) scale(1.05);
            text-shadow: 0 0 8px var(--primary-yellow);
        }
        #rebirth-btn:active {
            transform: translateY(-50%) scale(0.96);
        }

        /* 右上のステータスパネル (非表示) */
        .stats-container {
            display: none;
        }

        /* 左下のお金表示 */
        #money-display-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(6, 36, 18, 0.85);
            border: 1px solid var(--primary-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3), inset 0 0 15px rgba(0, 255, 102, 0.15);
            padding: 15px 25px;
            border-radius: 6px;
            font-weight: bold;
            text-align: left;
            backdrop-filter: blur(8px);
            z-index: 50;
            font-size: 1.5em;
            color: var(--primary-green);
            text-shadow: 0 0 10px var(--primary-green);
            display: flex;
            align-items: baseline;
        }

        /* ルーレット本体のコンテナ */
        .roulette-wrapper {
            position: relative;
            width: 450px;
            height: 450px;
            margin: 40px auto 20px;
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));
        }

        /* ターゲットポインター（上部の矢印） */
        .pointer {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid var(--primary-pink);
            z-index: 10;
            filter: drop-shadow(0 0 12px var(--primary-pink));
            animation: pointerPulse 1.5s infinite alternate ease-in-out;
        }
        @keyframes pointerPulse {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.15); }
        }

        /* 回転するホイール */
        .wheel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid var(--primary-cyan);
            box-shadow: 0 0 25px var(--primary-cyan), inset 0 0 35px var(--primary-cyan);
            background: conic-gradient(
                #0a192f 0deg 45deg,
                #2b00ff 45deg 90deg,   /* ゴット確定 */
                #0a192f 90deg 135deg,
                #ff00ff 135deg 180deg, /* Character Gacha */
                #051024 180deg 220deg,
                #888800 220deg 230deg, /* サンダー確定 (極小枠) */
                #ff1493 230deg 250deg, /* シークレット確定 (追加枠) */
                #051024 250deg 360deg
            );
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            transform: rotate(0deg);
        }

        /* ルーレット盤面の文字 */
        .wheel-label {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            text-shadow: 1px 1px 3px #000, 0 0 8px #000, 0 0 10px var(--primary-cyan);
            pointer-events: none;
        }
        .wheel-label span {
            display: inline-block;
            margin-top: 45px;
        }
        .kaminari-label {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px !important;
            font-size: 13px;
            line-height: 1.1;
        }
        .kaminari-label img {
            width: 64px;
            height: 64px;
            margin-bottom: 2px;
            filter: drop-shadow(0 0 8px var(--primary-pink));
            object-fit: contain;
            position: relative;
            z-index: 2;
        }

        #mutation-display-container img {
            display: none !important;
        }
        .mutation-thunder::after, .mutation-water::after {
            display: none !important;
        }

        /* 中央の装飾 */
        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--bg-dark);
            border: 2px solid var(--primary-cyan);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--primary-cyan), inset 0 0 10px var(--primary-cyan);
            z-index: 5;
        }

        /* システムメッセージ（結果表示） */
        #roulette-result {
            font-size: 1.4em;
            margin-bottom: 20px;
            height: 35px;
            font-weight: bold;
            text-shadow: 0 0 8px currentColor;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* コントロールボタン */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        button {
            position: relative;
            background: rgba(0, 255, 255, 0.1);
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 14px 28px;
            font-size: 1.1em;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25) inset, 0 0 8px rgba(0, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
            overflow: hidden;
        }
        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }
        button:hover:not(:disabled)::before {
            left: 100%;
        }
        button:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px var(--primary-cyan), inset 0 0 10px var(--primary-cyan);
            text-shadow: 0 0 8px var(--primary-cyan);
            transform: translateY(-2px) scale(1.03);
        }
        button:active:not(:disabled) {
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 0 10px var(--primary-cyan);
        }
        button:disabled {
            border-color: #334155;
            color: #475569;
            background: rgba(15, 23, 42, 0.6);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
        
        #spin10-btn {
            border-color: var(--primary-pink);
            color: var(--primary-pink);
        }
        #spin10-btn:hover:not(:disabled) {
            background: rgba(255, 0, 255, 0.3);
            box-shadow: 0 0 20px var(--primary-pink);
            text-shadow: 0 0 8px var(--primary-pink);
        }

        #fast-spin-btn {
            border-color: var(--primary-yellow);
            color: var(--primary-yellow);
        }
        #fast-spin-btn:hover:not(:disabled) {
            background: rgba(255, 204, 0, 0.3);
            box-shadow: 0 0 20px var(--primary-yellow);
            text-shadow: 0 0 8px var(--primary-yellow);
        }

        /* メニューモーダル */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(4, 13, 26, 0.95);
            border: 2px solid var(--primary-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5), inset 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 30px;
            z-index: 100;
            border-radius: 8px;
            min-width: 600px;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: blur(12px);
            animation: modalFadeIn 0.25s ease-out;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; transform: translate(-50%, -46%) scale(0.95); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .modal h2, .modal p {
            margin-top: 0;
            color: #fff;
            text-shadow: 0 0 8px var(--primary-cyan);
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            cursor: pointer;
            font-size: 1.8em;
            color: var(--primary-pink);
            font-weight: bold;
            transition: all 0.2s;
        }
        .close-btn:hover {
            transform: scale(1.2) rotate(90deg);
            text-shadow: 0 0 10px var(--primary-pink);
        }
        
        .prob-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            color: var(--primary-cyan);
        }
        .prob-table th, .prob-table td {
            border: 1px solid var(--primary-cyan);
            padding: 10px;
            text-align: center;
        }

        /* 近未来風 管理者パネル */
        #admin-panel {
            display: none;
            position: fixed;
            top: 20px;
            left: 120px;
            width: 420px;
            background: rgba(5, 15, 30, 0.96);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
            z-index: 999;
            border-radius: 8px;
            color: #fff;
            text-align: left;
            user-select: none;
            backdrop-filter: blur(10px);
        }
        #admin-header {
            background: linear-gradient(90deg, #00ffcc, #0088ff);
            color: #000;
            padding: 12px;
            font-weight: bold;
            font-size: 1.2em;
            text-align: center;
            cursor: move;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            text-shadow: 0 0 5px rgba(255,255,255,0.5);
        }
        
        .admin-tabs {
            display: flex;
            border-bottom: 1px solid #00ffcc;
        }
        .admin-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            background: rgba(0, 255, 204, 0.1);
            color: #00ffcc;
            font-size: 0.9em;
            font-weight: bold;
            border-right: 1px solid #00ffcc;
            transition: background 0.2s;
        }
        .admin-tab:last-child { border-right: none; }
        .admin-tab.active { background: #00ffcc; color: #000; }
        .admin-tab-content { display: none; padding: 20px; max-height: 450px; overflow-y: auto; }
        .admin-tab-content.active { display: block; }
        .close-admin { position: absolute; top: 10px; right: 15px; cursor: pointer; color: #000; font-size: 1.3em; font-weight: bold; }
        .admin-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; font-size: 0.9em; }
        .admin-row input, .admin-row select { background: #000; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px; margin-right: 5px; border-radius: 3px; }
        .admin-row button { background: rgba(0, 255, 204, 0.15); color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 12px; font-size: 0.85em; margin: 0; box-shadow: none; }
        .admin-row button:hover { background: #00ffcc; color: #000; box-shadow: 0 0 10px #00ffcc; }

        /* 右下・左下の特殊状態表示コンテナ */
        .status-display-container {
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            background: rgba(0, 20, 40, 0.8);
            padding: 8px 18px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            display: none;
        }
        
        #luck-display-container { right: 20px; bottom: 20px; }
        #mutation-display-container { left: auto; right: 20px; bottom: 95px; flex-direction: column; align-items: flex-end; gap: 8px; }
        .status-display-container img { width: 48px; height: 48px; margin-right: 10px; object-fit: contain; }
        .status-text { font-size: 1.5em; font-weight: bold; text-shadow: 0 0 10px currentColor, 0 0 5px #000; }

        /* 基地のアイテム表示用 */
        .base-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
            margin-top: 15px;
            max-height: 500px;
            overflow-y: auto;
            background: rgba(0,0,0,0.6);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 255, 0.3);
        }
        .base-item-wrapper {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .base-item-wrapper:hover { transform: scale(1.05); }
        .base-item {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px #ffd700);
            animation: pulse 2s infinite;
        }
        .base-item-rarity {
            font-size: 0.75em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid currentColor;
            box-shadow: 0 0 8px currentColor;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0 0 15px var(--primary-pink)); }
            100% { transform: scale(1); opacity: 0.85; }
        }

        /* 設定画面要素 */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0;
            padding: 10px 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
        }
        .settings-row select, .settings-row input {
            background: #000;
            color: var(--primary-cyan);
            border: 1px solid var(--primary-cyan);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 1em;
        }

        /* トレード画面用の個別スタイル */
        .trade-box {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
            margin-top: 15px;
        }
        .trade-slot {
            flex: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--primary-pink);
            padding: 15px;
            border-radius: 8px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .trade-slot-left {
            border-color: var(--primary-cyan);
            box-shadow: inset 0 0 15px rgba(0, 255, 255, 0.15);
        }
        
        .trade-slot-display {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            width: 100%;
            min-height: 60px;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 10px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
            border-radius: 4px;
        }

        .trade-char-select {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 10px;
            background: rgba(0, 20, 30, 0.5);
            padding: 8px;
            border-radius: 4px;
        }
        .trade-char-item {
            width: 50px;
            height: 50px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 4px;
            padding: 2px;
            transition: all 0.2s;
        }
        .trade-char-item:hover { filter: brightness(1.2); }
        .trade-char-item.selected {
            border-color: var(--primary-green);
            box-shadow: 0 0 10px var(--primary-green);
            background: rgba(0, 255, 102, 0.2);
        }

        /* トレード左側の強調OKボタン */
        .trade-ok-btn {
            margin-top: 12px;
            width: 100%;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: bold;
            border: 2px solid var(--primary-green);
            color: var(--primary-green);
            background: rgba(0, 255, 102, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .trade-ok-btn:hover:not(:disabled) {
            background: rgba(0, 255, 102, 0.4);
            box-shadow: 0 0 25px var(--primary-green);
            transform: scale(1.02);
        }
        .trade-ok-btn.active-ok {

        // --- P2P Network (PeerJS) 初期化 & 通信対応 ---
        function setupPeer(customPeerId = null) {
            if (peer) {
                try { peer.destroy(); } catch(e){}
            }
            
            const peerOptions = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },

                }
            };

            const targetId = customPeerId || myUserId;
            peer = new Peer(targetId, peerOptions);

            peer.on('open', (id) => {
                console.log('Peer connected successfully with ID:', id);
            });

            peer.on('connection', (conn) => {
                if (activeConn) {
                    try {
                        conn.send({ type: 'ROOM_FULL' });
                        conn.close();
                    } catch(e){}
                    return;
                }
                activeConn = conn;
                setupConnectionListeners(conn);
                renderTradeUI();
            });

            peer.on('disconnected', () => {
                if (peer && !peer.destroyed) {
                    peer.reconnect();
                }
            });

            peer.on('error', (err) => {
                console.error("PeerJS Error:", err);
                if (err.type === 'unavailable-id' && isHost) {
                    createTradeRoom();
                } else if (err.type === 'peer-unavailable') {
                    resetTradeState();
                    renderTradeUI();
                }
            });
        }

        function setupConnectionListeners(conn) {
            conn.on('open', () => {
                modal.style.display = 'block';

                if (mySelectedTradeIndices.length > 0) {
                    conn.send({ type: 'SELECT_CHARS', chars: mySelectedTradeIndices.map(i => baseItems[i]) });

            });

            conn.on('data', (data) => {
                if (!data) return;
                if (data.type === 'ROOM_FULL') {
                    resetTradeState();
                    renderTradeUI();
                } else if (data.type === 'SELECT_CHAR') {
                    peerSelectedTradeChars = [data.charStr];
                    peerTradeOk = false;
                    renderTradeUI();
                } else if (data.type === 'SELECT_CHARS') {
                    peerSelectedTradeChars = data.chars || [];
                    peerTradeOk = false;
                    renderTradeUI();
                } else if (data.type === 'TOGGLE_OK') {
                    peerTradeOk = data.ok;
                    renderTradeUI();
                    checkAndExecuteTrade();
                } else if (data.type === 'CANCEL') {
                    resetTradeState();

            });

            conn.on('close', () => {

        // --- Web Audio API 高品質サウンドジェネレーター ---
        class CyberAudioSynthesizer {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playClick() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.05);
            }
            playSpin() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playJackpot() {
                if (!isSoundEnabled) return;
                this.init(); if (!this.ctx) return;
                const notes = [440, 554.37, 659.25, 880, 1108.73, 1318.51, 1760];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.value = freq;
                    const startTime = this.ctx.currentTime + idx * 0.06;
                    gain.gain.setValueAtTime(0.25, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(startTime); osc.stop(startTime + 0.4);
                });
            }
        }

        // キャラクター抽選ロジック
        function rollCharacter(guaranteedRarity = null) {
            let pool = characters;
            if (guaranteedRarity) {
                pool = characters.filter(c => c.rarity === guaranteedRarity);
                if(pool.length > 0) return pool[Math.floor(Math.random() * pool.length)];
            }
            
            const rand = Math.random() * 100;
            if (rand < 0.5) {
                const thunders = characters.filter(c => c.rarity === 'サンダー');
                return thunders[Math.floor(Math.random() * thunders.length)];
            }
            if (rand < 2.0) {
                const secrets = characters.filter(c => c.rarity === 'シークレット');
                return secrets[Math.floor(Math.random() * secrets.length)];
            }
            if (rand < 6.0) {
                const gods = characters.filter(c => c.rarity === 'ゴット');
                return gods[Math.floor(Math.random() * gods.length)];
            }
            if (rand < 21.0) {
                const legends = characters.filter(c => c.rarity === 'レジェンド');
                return legends[Math.floor(Math.random() * legends.length)];
            }
            if (rand < 51.0) {
                const rares = characters.filter(c => c.rarity === 'レア');
                return rares[Math.floor(Math.random() * rares.length)];
            }
            const uncommons = characters.filter(c => c.rarity === 'アンコモン');
            return uncommons[Math.floor(Math.random() * uncommons.length)];
        }

        function rollMutation() {
            const rand = Math.random() * 100;
            if (rand < 0.1) return 'rainbow';
            if (rand < 1) return 'diamond'; 
            if (rand < 6) return 'gold';    
            return 'normal';
        }

        const processSpin = () => {
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            const spin10Btn = document.getElementById('spin10-btn');
            if (spin10Btn) spin10Btn.disabled = true;
            
            const resultElement = document.getElementById('roulette-result');
            resultElement.innerText = t('processingMsg');
            resultElement.style.color = "#0ff";

            audioSynth.playSpin();
            if (isSoundEnabled) {
                const spinSound = document.getElementById('spin-sound');
                spinSound.currentTime = 0;
                spinSound.play().catch(() => {});
            }

            const rand = Math.random() * 100;
            let targetAngle = 0;
            let resultType = "";

            if (rand < 0.005) {
                resultType = "サンダー";
                targetAngle = 360 - 225;
            } else if (rand < 1.005) {
                resultType = "シークレット";
                targetAngle = 360 - 240;
            } else if (rand < 40) {
                resultType = "アンコモン";
                targetAngle = Math.random() > 0.5 ? 360 - 22.5 : 360 - 305;
            } else if (rand < 45) {
                resultType = "ゴット";
                targetAngle = 360 - 67.5;
            } else if (rand < 60) {
                resultType = "レジェンド";
                targetAngle = 360 - 112.5;
            } else {
                resultType = "gacha";
                targetAngle = 360 - 157.5;
            }

            const randomOffset = (Math.random() * 10) - 5;
            targetAngle += randomOffset;

            const currentDeg = currentRotation % 360;
            let extraRotation = targetAngle - currentDeg;
            if (extraRotation < 0) extraRotation += 360;
            
            currentRotation += (1800 + extraRotation);
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

            const spinDuration = isFastSpin ? 1000 : 4000;

            setTimeout(() => {
                let rolledChar;
                if (resultType === "gacha") rolledChar = rollCharacter();
                else rolledChar = rollCharacter(resultType);

                let mutation = rollMutation();
                let storeId = rolledChar.id + ":" + mutation + ":none";

                baseItems.push(storeId);
                unlockedCharacters[rolledChar.id + ":" + mutation] = true;
                
                money += 100;
                
                let mutText = "";
                if (mutation === 'gold') mutText = "【GOLD変異】";
                if (mutation === 'diamond') mutText = "【DIAMOND変異】";
                if (mutation === 'rainbow') mutText = "【RAINBOW変異】";

                resultElement.innerText = `>> 獲得: ${rolledChar.name} [${rolledChar.rarity}] ${mutText} (+$${formatMoney(100)}) <<`;
                resultElement.style.color = rolledChar.color || "#ff00ff";
                
                audioSynth.playJackpot();
                if (isSoundEnabled) {
                    const audio = document.getElementById('kaminari-audio');
                    audio.currentTime = 0;
                    audio.play().catch(() => {});
                }

                saveState();
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                if (spin10Btn) spin10Btn.disabled = false;
                updateUI();
            }, spinDuration);
        };

        function createTradeRoom() {
            audioSynth.playClick();
            resetTradeState();
            currentRoomCode = Math.floor(1000 + Math.random() * 9000).toString();
            isHost = true;
            setupPeer('trade-room-' + currentRoomCode);
            renderTradeUI();

        function joinTradeRoom() {
            audioSynth.playClick();
            const inputEl = document.getElementById('join-room-id');
            if (!inputEl) return;
            const code = inputEl.value.trim();
            if (!/^\d{4}$/.test(code)) {
                return;
            }

            resetTradeState();
            currentRoomCode = code;
            isHost = false;

            const guestPeerId = 'trade-guest-' + Math.floor(100000 + Math.random() * 900000).toString();
            if (peer) { try { peer.destroy(); } catch(e){} }

            const peerOptions = {
                debug: 1,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                }
            };
            peer = new Peer(guestPeerId, peerOptions);

            peer.on('open', () => {
                const targetHostId = 'trade-room-' + currentRoomCode;
                const conn = peer.connect(targetHostId, { reliable: true });
                let connected = false;
                const timeout = setTimeout(() => {
                    if (!connected && !activeConn) {
                        resetTradeState();
                        renderTradeUI();
                    }
                }, 10000);

                conn.on('open', () => {
                    connected = true;
                    clearTimeout(timeout);
                    activeConn = conn;
                    setupConnectionListeners(conn);
                    renderTradeUI();
                });
                conn.on('error', (err) => {
                    clearTimeout(timeout);
                    resetTradeState();
                    renderTradeUI();
                });
            });

            peer.on('error', (err) => {
                console.error("Guest Peer Error:", err);
                resetTradeState();
                renderTradeUI();
            });
            renderTradeUI();
        }

        function selectTradeChar(index) {
            audioSynth.playClick();
            const pos = mySelectedTradeIndices.indexOf(index);
            if (pos > -1) {
                mySelectedTradeIndices.splice(pos, 1);
            } else {
                mySelectedTradeIndices.push(index);
            }
            myTradeOk = false;
            if (activeConn) {
                activeConn.send({ type: 'SELECT_CHARS', chars: mySelectedTradeIndices.map(i => baseItems[i]) });
            }
            renderTradeUI();
        }

        function toggleMyOk() {
            audioSynth.playClick();
            myTradeOk = !myTradeOk;
            if (activeConn) {
                activeConn.send({ type: 'TOGGLE_OK', ok: myTradeOk });
            }
            renderTradeUI();
            checkAndExecuteTrade();
        }

        function checkAndExecuteTrade() {
            if (myTradeOk && peerTradeOk && activeConn) {
                let maxCap = getMaxBaseCapacity();
                let newTotal = baseItems.length - mySelectedTradeIndices.length + peerSelectedTradeChars.length;
                if (newTotal > maxCap) {
                    myTradeOk = false;
                    peerTradeOk = false;
                    activeConn.send({ type: 'TOGGLE_OK', ok: false });
                    renderTradeUI();
                    return;
                }

                setTimeout(() => {
                    // 自分が出すキャラを削除（インデックスがずれないよう降順で処理）
                    mySelectedTradeIndices.sort((a,b) => b - a).forEach(idx => {
                        baseItems.splice(idx, 1);
                    });

                    // 相手からもらったキャラを追加
                    peerSelectedTradeChars.forEach(charStr => {
                        baseItems.push(charStr);
                        let pParts = charStr.split(':');
                        unlockedCharacters[pParts[0] + ":" + (pParts[1] || 'normal')] = true;
                    });

                    saveState();
                    updateUI();
                    audioSynth.playJackpot();

                    cancelTrade();
                    closeModal();
                }, 500);
            }
        }

            audioSynth.playClick();
            if (activeConn) {
                try { activeConn.send({ type: 'CANCEL' }); } catch(e){}

            resetTradeState();
            setupPeer();
            renderTradeUI();

        function executeRebirth() {
            let cost = rebirthCosts[rebirthCount];
            if (money >= cost && rebirthCount < 10) {
                audioSynth.playJackpot();
                money -= cost;
                rebirthCount++;
                saveState();
                updateUI();
                openRebirthMenu();
            }
        }

        // --- 自動お金稼ぎループ ---
        setInterval(() => {
            let income = 0;
            if (baseItems.length > 0) {
                baseItems.forEach(itemStr => {
                    let parts = itemStr.split(':');
                    let charId = parts[0];
                    let charInfo = characters.find(c => c.id === charId) || characters[0];
                    
                    let baseIncome = 1;
                    if (charInfo.rarity === 'レア') baseIncome = 2;
                    else if (charInfo.rarity === 'レジェンド') baseIncome = 5;
                    else if (charInfo.rarity === 'ゴット') baseIncome = 10;
                    else if (charInfo.rarity === 'シークレット') baseIncome = 50;
                    else if (charInfo.rarity === 'サンダー') baseIncome = 100;
                    
                    let mutType = parts[1] || 'normal';
                    if (mutType === 'gold') baseIncome *= 2;
                    if (mutType === 'diamond') baseIncome *= 5;
                    if (mutType === 'rainbow') baseIncome *= 20;
                    
                    income += baseIncome;
                });
                
                // リバースボーナス (1回につき +50%)
                income = Math.floor(income * (1 + (rebirthCount * 0.5)));
                money += income;
            }
            
            document.getElementById('money-val').innerText = formatMoney(money);
            
            const incomeEl = document.getElementById('income-val');
            if (incomeEl) {
                if (income > 0) {
                    incomeEl.innerText = `(+${formatMoney(income)}/s)`;
                } else {
                    incomeEl.innerText = "";

            }

        setInterval(updateStatusEffects, 1000);

                if (modal.style.display === 'block') closeModal();

            }

            if (isAdminUnlocked && e.key.toLowerCase() === 'k') {
                const adminPanel = document.getElementById('admin-panel');
                adminPanel.style.display = adminPanel.style.display === 'block' ? 'none' : 'block';
            }

            secretBuffer += e.key;
            if (secretBuffer.length > 10) secretBuffer = secretBuffer.slice(-10);
            if (secretBuffer.includes("140923")) {

                document.getElementById('admin-panel').style.display = 'block';

                                    (activeMutations.water !== 0 && (activeMutations.water > now || activeMutations.water === -1));

        function manageBaseCharacter(index) {
            audioSynth.playClick();
            let itemStr = baseItems[index];
            let parts = itemStr.split(':');
            let charId = parts[0];
            let mutType = parts[1] || 'normal';
            let buffType = parts[2] || 'none';

            let charInfo = characters.find(c => c.id === charId) || characters[0];
            let sellPrice = 100;
            if (charInfo.rarity === 'ゴット') sellPrice = 2000;
            if (charInfo.rarity === 'レジェンド') sellPrice = 800;
            if (charInfo.rarity === 'シークレット') sellPrice = 3000;
            if (charInfo.rarity === 'サンダー') sellPrice = 5000;

            if (mutType === 'diamond') sellPrice *= 10;
            if (mutType === 'rainbow') sellPrice *= 50;

            let buffText = "<span style='color:#777;'>[ バフなし ]</span>";
            if(buffType === 'thunder') buffText = "<span style='color:#e6e600; font-weight:bold;'>[ 雷バフ 発動中 ]</span>";

        function sellCharacter(index, price) {
            audioSynth.playClick();

                baseItems.splice(index, 1);
                money += price;
                saveState();
                updateUI();
                showBaseMenu();
            }

        function applyBuffToCharacter(index) {
            audioSynth.playClick();
            let itemStr = baseItems[index];
            let parts = itemStr.split(':');
            let charId = parts[0];
            let mutType = parts[1] || 'normal';
            let buffType = parts[2] || 'none';

            if (buffType !== 'none') {
                return;
            }

            let currentProb = getBaseBuffProbability();
            let rand = Math.random() * 100;

            if (rand < currentProb) {
                let newBuff = Math.random() < 0.5 ? 'thunder' : 'water';
                baseItems[index] = `${charId}:${mutType}:${newBuff}`;
                saveState();
                manageBaseCharacter(index); 
            }
        }

            audioSynth.playClick();
            if (baseItems.length > 0) {

                        if (charInfo.rarity === 'シークレット') sellPrice = 3000;
                        if (charInfo.rarity === 'サンダー') sellPrice = 5000;
                        if (mutType === 'gold') sellPrice *= 3;
                        if (mutType === 'diamond') sellPrice *= 10;
                        if (mutType === 'rainbow') sellPrice *= 50;

                        <img src="${c.img}" style="width:70px; height:70px; object-fit:contain; filter:drop-shadow(0 0 5px ${c.color});"><br>
                        <div style="color:${c.color}; font-size:0.9em; margin: 8px 0; font-weight:bold; word-wrap:break-word;">${c.name}</div>
                        <div style="font-size:0.75em; color:#ddd; margin-bottom:6px;">レア度: ${c.rarity}</div>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <button onclick="addSpecificCharToBase('${c.id}', 'normal')" style="padding:6px; font-size:0.8em;">通常追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'gold')" style="padding:6px; font-size:0.8em; color:gold; border-color:gold;">GOLD追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'diamond')" style="padding:6px; font-size:0.8em; color:cyan; border-color:cyan;">DIAMOND追加</button>
                            <button onclick="addSpecificCharToBase('${c.id}', 'rainbow')" style="padding:6px; font-size:0.8em; color:#ff00ff; border-color:#ff00ff;">RAINBOW追加</button>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            modalBody.innerHTML = html;
        }

        // キャラクター出現メッセージを表示せずにサイレント追加する関数
        function addSpecificCharToBase(charId, mutation = 'normal') {
            audioSynth.playClick();
            if (baseItems.length >= getMaxBaseCapacity()) {
                return;
            }
            let storeId = charId + ":" + mutation + ":none";
            baseItems.push(storeId);
            unlockedCharacters[charId + ":" + mutation] = true;
            saveState();
            updateUI();
            // メッセージ(alert)表示を排除
        }
    </script>
</body>
</html>
